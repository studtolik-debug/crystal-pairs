<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Фруктовый кувшин</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a0d08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#140906;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 0%,#4a2418 0%,#22100a 55%,#0c0503 100%);}
  /* Канва вписывается в экран, сохраняя пропорции 480x800.
     Задавать height:100% нельзя: тогда aspect-ratio игнорируется, а max-width
     просто сплющивает картинку — на узком телефоне игра ехала по вертикали.
     У canvas есть собственные пропорции, поэтому двух max- ограничений хватает. */
  canvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;
    touch-action:none;
    border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 0 1px rgba(255,200,140,.14);
    cursor:pointer;}
  /* канва достроена до пропорций экрана и занимает его целиком (см. fitView) */
  canvas.full{border-radius:0;box-shadow:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<!-- щуп для выреза под камеру и полоски «домой» на iPhone (см. fitView) -->
<div id="safe" style="position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)"></div>
<script>
"use strict";

/* ============== КОНСТАНТЫ ============== */
var W = 480, H = 800;
var GRAV = 1500;

/* Кувшин нарисован картинками scene/jug-back.png (за фруктами) и
   scene/jug-front.png (поверх них). JUG_K — игровых единиц на пиксель
   картинки; задний слой стоит центром (JUG_BX по картинке) на CX, верхом —
   на JUG_Y0, а дном — на барной стойке фона. Передний слой на 0.5% крупнее
   и сдвинут на (1, 4) пикселя: так оба совпадают по контуру. */
var CX = 230;
var JUG_K = 0.62, JUG_Y0 = 219, JUG_BX = 330.5;
var FRONT_S = 1.005, FRONT_DX = 1, FRONT_DY = 4;

/* Внутренний профиль [y, полуширина] снят с картинки: внешний край стекла
   по прозрачности минус 12 пикселей толщины стенки, через каждые 20 пикселей,
   переведён в игровые координаты. Дно — там, где фрукты встают на толстое
   стеклянное донце. Дальше профиль сглаживается сплайном. */
var PROFILE = [[238,136],[250,132.4],[262,128],[275,126.5],[287,128.7],[300,133],[312,138.9],
  [324,144.8],[337,151.3],[349,157.5],[362,163.1],[374,168.9],[386,173.9],[399,178.3],[411,182.3],
  [424,186],[436,189.4],[448,191.9],[461,194.1],[473,195.3],[486,196.2],[498,196.8],[510,196.8],
  [523,196.5],[535,195.6],[548,193.8],[560,191.9],[572,189.1],[585,185.1],[597,181],[610,176.4],
  [622,170.5],[634,164.3],[647,157.2],[659,149.1],[672,139.8],[684,129.3],[696,117.5]];
var RIM_Y = 238, RIM_HW = 136, NECK_HW = 126.5, BOTTOM_Y = 696;
var GLASS_T = 9;                    /* толщина стекла — для запасного кувшина, нарисованного кодом */

/* Фрукт висит на прищепке под перекладиной и падает по клику.
   Перекладина сразу под гирляндой фона, чтобы даже апельсин целиком
   висел над краем кувшина. */
var RAIL_Y = 96;
var DROP_CD = 0.5;                  /* сек. до появления следующего фрукта */
/* нитка привязана к кончику хвостика, а не к макушке тела */
function hoverY(t){ return RAIL_Y + 12 - SHAPES[t].hy; }

/* Баланс подобран прогоном ботов: при 120 фруктах бот, бросающий наугад,
   переполняет кувшин в 4–5 партиях из 5 (в среднем к 90-му броску),
   а бот, целящийся в такой же фрукт, — примерно в половине партий. */
var BASE_DROPS = 120;

/* Ящик с фруктами выпадает при слиянии. Слияний примерно MERGE_RATE на бросок,
   поэтому прибавка за бросок = MERGE_RATE * CRATE_CHANCE * CRATE_BONUS.
   Она обязана быть заметно меньше 1, иначе запас растёт быстрее, чем тратится,
   и счётчик фруктов перестаёт быть концом партии. */
var CRATE_CHANCE = 0.015;
var CRATE_BONUS = 10;
var CRATE_SCORE = 150;

/* второй, аварийный конец — фрукты доросли до горлышка */
var DANGER_Y = 282;                 /* чуть ниже самого узкого места горлышка */
var DANGER_HOLD = 1.6;              /* сек. над чертой, прежде чем засчитать переполнение */

/* c — цвет стекла, d — тёмный край, l — светлая сердцевина.
   Размеры уменьшены на 6% под кувшин с картинки: он вмещает на 10% меньше
   прежнего, и с прежними фруктами переполнялся заметно раньше. */
var FRUITS = [
  { name:"Ящик",     r:30,   c:[255,200,90],  d:[120,70,20],  l:[255,240,190], crate:true },
  { name:"Вишня",    r:21.5, c:[236,28,64],   d:[110,0,28],   l:[255,170,190] },
  { name:"Клубника", r:28,   c:[255,58,78],   d:[140,10,30],  l:[255,195,205] },
  { name:"Лайм",     r:35.5, c:[140,226,60],  d:[38,108,18],  l:[225,255,185] },
  { name:"Апельсин", r:45,   c:[255,150,30],  d:[168,66,0],   l:[255,228,165] },
  { name:"Драгонфрукт", r:54.5, c:[255,62,150], d:[150,0,80], l:[255,200,232] },
  { name:"Ананас",   r:66.5, c:[255,192,58],  d:[150,92,8],   l:[255,242,195] },
  { name:"Арбуз",    r:83.5, c:[72,192,82],   d:[14,78,28],   l:[205,255,205] }
];
var TOP = 7;                        /* арбуз — самый крупный; два арбуза разбиваются насовсем */
var SCORES = [0, 0, 10, 25, 60, 140, 320, 1500];
var JACKPOT = 3000;
var POOL   = [1,1,1,2,2,3,3,4];     /* сверху падают только первые 4 */

/* Картинки фруктов и границы их тел.
   Всё в пикселях исходной картинки (ow x oh); файлы в img/ — её уменьшенные
   копии, пропорции те же. Тело: эллипсы ["e", cx, cy, a, b, поворот°] и круги
   ["c", cx, cy, r], обведённые по маске прозрачности. Хвостики, листья и
   кончики кроны в тело не входят — они не толкаются.
   unit — сколько пикселей картинки соответствует FRUITS[t].r: площадь тела
   остаётся прежней, баланс не плывёт. */
var ART = [
  null,
  { src:"img/cherry.png",     ow:1275, oh:1632, unit:564, hook:[960,18], body:[["e",587,1085,590,540,0]] },
  { src:"img/strawberry.png", ow:1302, oh:1635, unit:580, hook:[978,18], body:[["c",631,920,560],["c",610,1230,400],["c",560,1450,190]] },
  { src:"img/lime.png",       ow:1538, oh:1719, unit:721, hook:[1218,18], body:[["e",714,995,735,707,-76.8]] },
  { src:"img/orange.png",     ow:1539, oh:1722, unit:727, hook:[1218,18], body:[["e",723,999,734,721,-85]] },
  { src:"img/dragon.png",     ow:1323, oh:1709, unit:613, hook:[1143,18], body:[["e",669,988,714,527,-65.5]] },
  { src:"img/pineapple.png",  ow:943,  oh:1803, unit:457, hook:[464,20], body:[["e",454,1330,444,470,0],["c",455,640,230]] },
  { src:"img/watermelon.png", ow:1521, oh:1712, unit:747, hook:[1250,16], body:[["e",757,977,763,732,9.4]] }
];

/* Эллипс -> цепочка кругов вдоль большой оси. Радиус каждого — вписанный
   в эллипс в этой точке, крайние касаются вершин, так что цепочка повторяет
   овал почти без зазоров. Почти круглый эллипс — один круг той же площади. */
function ellipseCircles(cx, cy, a, b, deg, out){
  if (a < b){ var t = a; a = b; b = t; deg += 90; }
  if (a/b < 1.06){ out.push([cx, cy, Math.sqrt(a*b)]); return; }
  var th = deg*Math.PI/180, ux = Math.cos(th), uy = Math.sin(th);
  var n = a/b < 1.2 ? 3 : 5, c2 = a*a - b*b, tmax = c2/a;
  for (var i=0;i<n;i++){
    var s = -tmax + 2*tmax*i/(n-1);
    out.push([cx + ux*s, cy + uy*s, b*Math.sqrt(Math.max(0, 1 - s*s/c2))]);
  }
}

/* SHAPES[t]: круги тела в игровых единицах относительно центра масс,
   момент инерции на единицу массы и габариты в покое (угол 0). */
var SHAPES = [];
(function(){
  for (var t=0;t<FRUITS.length;t++){
    var art = ART[t], r = FRUITS[t].r, cs = [], i;
    if (!art) cs.push([0, 0, r]);
    else {
      var px = [], k = r/art.unit;
      for (i=0;i<art.body.length;i++){
        var p = art.body[i];
        if (p[0] === "c") px.push([p[1], p[2], p[3]]);
        else ellipseCircles(p[1], p[2], p[3], p[4], p[5], px);
      }
      for (i=0;i<px.length;i++) cs.push([px[i][0]*k, px[i][1]*k, px[i][2]*k]);
    }
    /* центр масс — среднее центров с весом по площади круга */
    var sw = 0, mx = 0, my = 0;
    for (i=0;i<cs.length;i++){ var w = cs[i][2]*cs[i][2]; sw += w; mx += cs[i][0]*w; my += cs[i][1]*w; }
    mx /= sw; my /= sw;
    var R = 0, k2 = 0, top = 0, bot = 0, hw = 0;
    for (i=0;i<cs.length;i++){
      var c = cs[i]; c[0] -= mx; c[1] -= my;
      var d = Math.sqrt(c[0]*c[0] + c[1]*c[1]);
      R = Math.max(R, d + c[2]);
      k2 += c[2]*c[2] * (c[2]*c[2]/2 + d*d);
      top = Math.max(top, c[2] - c[1]); bot = Math.max(bot, c[1] + c[2]); hw = Math.max(hw, Math.abs(c[0]) + c[2]);
    }
    SHAPES[t] = { c: cs, R: R, k2: k2/sw, top: top, bot: bot, hw: hw,
                  /* где центр масс на картинке — в игровых единицах от её левого верхнего угла */
                  ix: art ? mx : 0, iy: art ? my : 0,
                  iw: art ? art.ow*r/art.unit : 0, ih: art ? art.oh*r/art.unit : 0,
                  /* кончик хвостика — за него фрукт висит на нитке */
                  hx: art ? art.hook[0]*r/art.unit - mx : 0, hy: art ? art.hook[1]*r/art.unit - my : -r };
  }
})();

/* ============== CANVAS ============== */
var cv = document.getElementById("game");
var ctx = cv.getContext("2d");
var DPR = Math.min(2, window.devicePixelRatio || 1);
/* Игровое поле всегда 480x800, но телефоны вытянутее 3:5, и сверху и снизу
   оставались пустые полосы. На высоком экране канва растёт до VH игровых
   единиц, поле стоит посередине (OY — высота полосы над ним), а полосы
   достраиваются из краёв фона (bakeExt). На широком экране всё как было. */
var VH = H, OY = 0;
var VH_MAX = 1200;                  /* вытянутее ~2.5:1 — снова поля сверху и снизу */
function fitView(force){
  var w = window.innerWidth, h = window.innerHeight, vh = H;
  if (w > 0 && h > 0) vh = Math.max(H, Math.min(VH_MAX, W*h/w));
  if (!force && Math.abs(vh - VH) < 0.5) return;
  VH = vh;
  /* Таблички счёта висят у верхнего края экрана, панели — у нижнего
     (layoutUI). Если внизу помещаются два ряда панелей, сцену ставим так,
     чтобы просветы между ней и панелями сверху и снизу были равными;
     иначе — посередине, как раньше. Сцена — от края крыши (y 60) до
     переднего края стойки (y 736). */
  var E = VH - H;
  HUD.u = Math.min(1.3, 1 + E/300);
  /* вырез под камеру и полоска «домой» (iPhone): CSS-пиксели -> игровые единицы.
     На Android окно само не заходит под камеру, там они нулевые. */
  var safe = document.getElementById("safe"), k = w > 0 ? W / w : 1;
  SAFE_TOP = safe ? (parseFloat(getComputedStyle(safe).paddingTop) || 0) * k : 0;
  SAFE_BOT = safe ? (parseFloat(getComputedStyle(safe).paddingBottom) || 0) * k : 0;
  var topUI = SAFE_TOP + 8 + 52*HUD.u;
  var bot2 = SAFE_BOT + 20 + NEXT_BOX.h*UI_BTN_U + LADDER_BOX.h*UI_LADDER_U;
  UI_TWO_ROWS = VH >= bot2 + 742 + topUI - 60;
  OY = UI_TWO_ROWS ? Math.max(topUI - 60, (VH - bot2 - 796 + topUI)/2) : E/2;
  cv.width = Math.round(W*DPR); cv.height = Math.round(VH*DPR);
  cv.className = VH > H + 0.5 ? "full" : "";
  ctx.setTransform(DPR,0,0,DPR,0,OY*DPR);
  bakeExt();
  layoutUI();
}
/* весь экран в игровых координатах — для затемнений и вспышек */
function fillView(){ ctx.fillRect(0, -OY, W, VH); }

function rgba(c, a){ return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

/* ============== ГЕОМЕТРИЯ КУВШИНА ============== */
var SIDE = [];                      /* сглаженный профиль: [y, hw] сверху вниз */
(function(){
  var P = PROFILE, n = P.length, STEPS = 6, i, k;
  function at(i){ return P[Math.max(0, Math.min(n-1, i))]; }
  function cr(a, b, c, d, t){
    var t2 = t*t, t3 = t2*t;
    return 0.5*((2*b) + (-a+c)*t + (2*a-5*b+4*c-d)*t2 + (-a+3*b-3*c+d)*t3);
  }
  for (i=0;i<n-1;i++){
    var p0 = at(i-1), p1 = at(i), p2 = at(i+1), p3 = at(i+2);
    for (k=0;k<STEPS;k++){
      var t = k/STEPS;
      var y = cr(p0[0],p1[0],p2[0],p3[0],t), hw = cr(p0[1],p1[1],p2[1],p3[1],t);
      SIDE.push([Math.min(BOTTOM_Y, y), hw]);
    }
  }
  SIDE.push(P[n-1].slice());
})();

/* полуширина на любой высоте — для страховки и для осколков */
var HWT = new Float32Array(BOTTOM_Y + 2);
(function(){
  var j = 0;
  for (var y=0; y<=BOTTOM_Y+1; y++){
    if (y <= RIM_Y){ HWT[y] = RIM_HW; continue; }
    while (j < SIDE.length-2 && SIDE[j+1][0] < y) j++;
    var a = SIDE[j], b = SIDE[j+1];
    var t = b[0] > a[0] ? (y - a[0])/(b[0] - a[0]) : 1;
    HWT[y] = a[1] + (b[1]-a[1])*Math.max(0, Math.min(1, t));
  }
})();
function hwAt(y){
  if (y <= RIM_Y) return RIM_HW;
  if (y >= BOTTOM_Y) return HWT[BOTTOM_Y];
  return HWT[y|0];
}

/* Стенки — ломаная: невидимая вертикаль над левым краем, левый бок вниз,
   дно, правый бок вверх, вертикаль над правым краем. Внутрь смотрит (dy,-dx). */
var SEGS = [];
var LOOP = [];                      /* замкнутый внутренний контур для рисования */
(function(){
  var pts = [[CX - RIM_HW, -600]], i;
  for (i=0;i<SIDE.length;i++){ pts.push([CX - SIDE[i][1], SIDE[i][0]]); LOOP.push([CX - SIDE[i][1], SIDE[i][0]]); }
  for (i=SIDE.length-1;i>=0;i--){ pts.push([CX + SIDE[i][1], SIDE[i][0]]); LOOP.push([CX + SIDE[i][1], SIDE[i][0]]); }
  pts.push([CX + RIM_HW, -600]);
  for (i=0;i<pts.length-1;i++){
    var a = pts[i], b = pts[i+1];
    var dx = b[0]-a[0], dy = b[1]-a[1], l2 = dx*dx + dy*dy;
    if (l2 < 0.01) continue;
    var len = Math.sqrt(l2);
    SEGS.push({ ax:a[0], ay:a[1], dx:dx, dy:dy, l2:l2, nx:dy/len, ny:-dx/len,
      x0:Math.min(a[0],b[0]), x1:Math.max(a[0],b[0]), y0:Math.min(a[1],b[1]), y1:Math.max(a[1],b[1]) });
  }
})();

/* наружный контур стекла: внутренний, сдвинутый по нормали наружу */
var OUTER = [];
(function(){
  var n = LOOP.length;
  for (var i=0;i<n;i++){
    var p = LOOP[Math.max(0,i-1)], q = LOOP[Math.min(n-1,i+1)];
    var tx = q[0]-p[0], ty = q[1]-p[1], l = Math.sqrt(tx*tx+ty*ty) || 1;
    var t = LOOP[i][1] > BOTTOM_Y - 10 ? GLASS_T + 4 : GLASS_T;
    OUTER.push([LOOP[i][0] - ty/l*t, LOOP[i][1] + tx/l*t]);
  }
})();

/* ============== ЗВУК ============== */
var AC = null, OUT = null, NOISE = null, muted = false;
function audio(){
  if (muted) return null;
  try {
    if (!AC){
      AC = new (window.AudioContext||window.webkitAudioContext)();
      var comp = AC.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 5;
      OUT = AC.createGain(); OUT.gain.value = 0.9;
      OUT.connect(comp); comp.connect(AC.destination);
    }
  } catch(e){ return null; }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, delay){
  var ac = audio(); if(!ac) return;
  var t0 = ac.currentTime + (delay||0);
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type||"sine"; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol||0.12, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(OUT);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
/* звон стекла: основной тон и два негармоничных обертона, как у бокала */
var PING_PARTIALS = [[1, 1], [2.76, 0.38], [5.4, 0.14]];
function ping(freq, dur, vol, delay){
  var ac = audio(); if(!ac) return;
  var t0 = ac.currentTime + (delay||0);
  for (var i=0;i<PING_PARTIALS.length;i++){
    var m = PING_PARTIALS[i][0], f = freq*m;
    if (f > 16000) continue;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol*PING_PARTIALS[i][1], t0 + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur/Math.sqrt(m));
    o.connect(g); g.connect(OUT);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
}
function noise(dur, vol, delay, type, freq, q){
  var ac = audio(); if(!ac) return;
  if (!NOISE){
    NOISE = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    var nd = NOISE.getChannelData(0);
    for (var i=0;i<nd.length;i++) nd[i] = Math.random()*2 - 1;
  }
  var t0 = ac.currentTime + (delay||0);
  var src = ac.createBufferSource(); src.buffer = NOISE;
  var f = ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0);
  if (q) f.Q.setValueAtTime(q, t0);
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(OUT);
  src.start(t0, Math.random()*0.4); src.stop(t0 + dur + 0.05);
}

/* Разбитое стекло = резкий треск + шелест осколков + россыпь звонких «дзинь».
   Чем крупнее фрукт, тем ниже звон, длиннее хвост и больше осколков. */
var lastShatter = -1;
function sfxShatter(tier){
  var ac = audio(); if(!ac) return;
  var big = tier / TOP;
  /* два слияния за один миг не должны сливаться в оглушительный хлопок */
  var k = (ac.currentTime - lastShatter < 0.06) ? 0.5 : 1;
  lastShatter = ac.currentTime;
  noise(0.05 + big*0.05, 0.34*k, 0, "highpass", 2000, 0.7);
  noise(0.20 + big*0.28, 0.13*k, 0.006, "bandpass", 4300 - big*1600, 2.2);
  var n = 6 + tier*2;
  for (var i=0;i<n;i++){
    var dl = 0.008 + Math.pow(Math.random(), 1.7) * (0.28 + big*0.35);
    var f = (2300 + Math.random()*5200) * (1 - big*0.32);
    ping(f, 0.07 + Math.random()*0.2, (0.022 + Math.random()*0.034)*k, dl);
  }
  if (tier >= 4) tone(170 - tier*10, 0.16, "sine", (0.05 + big*0.05)*k);
}
var lastClink = -1;
function clink(v){
  var ac = audio(); if(!ac) return;
  if (ac.currentTime - lastClink < 0.07) return;
  lastClink = ac.currentTime;
  ping(2500 + Math.random()*2200, 0.09, Math.min(0.045, v/15000), 0);
}
function sfxDrop(){ noise(0.07, 0.05, 0, "bandpass", 1400, 1.2); tone(760, 0.05, "triangle", 0.03); }
function sfxMelon(){ var d=[0.1,0.19,0.28,0.37,0.48]; for(var i=0;i<5;i++) tone(523*Math.pow(1.26,i),0.5,"triangle",0.09,d[i]); }
function sfxOver(){ var f=[440,392,330,262]; for(var i=0;i<4;i++) tone(f[i],0.5,"sine",0.10,i*0.16); }
function sfxCrate(){
  noise(0.09, 0.12, 0, "lowpass", 600, 0.8);
  tone(150, 0.14, "triangle", 0.08);
  var f=[784,988,1175,1568];
  for(var i=0;i<4;i++) tone(f[i], 0.34, "triangle", 0.08, 0.06 + i*0.07);
}

/* ============== СОСТОЯНИЕ ============== */
var S;
function pick(){ return POOL[(Math.random()*POOL.length)|0]; }
function reset(){
  S = {
    gems: [], parts: [], shards: [], rings: [], pops: [], flyers: [], cocktailBump: 0,
    queue: [pick(), pick()],
    drops: 0, left: BASE_DROPS, score: 0, cocktails: 0, jackpots: 0, crates: 0, merges: 0,
    over: false, reason: "", danger: 0, settle: 0, endWait: 0, shake: 0, crateFlash: 0,
    aimX: CX, cool: 0,
    time: 0, flash: 0
  };
  acc = 0; prev = performance.now();   /* чистые часы на рестарт, без скачка dt */
}

/* ============== ХРАНИЛИЩЕ ==============
   localStorage доступен не всегда: в data:-URL он запрещён совсем, в file://
   и приватных окнах — как повезёт. Прячем это за две функции и один флаг,
   чтобы игра не падала, а игрок понимал, сохранятся его результаты или нет. */
function storeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function storeSet(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } }
var STORAGE_OK = storeSet("__fj_probe", "1");
if (STORAGE_OK) { try { localStorage.removeItem("__fj_probe"); } catch(e){} }

var BEST_KEY = "fruitJugBest";
var best = parseInt(storeGet(BEST_KEY) || "0", 10) || 0;

/* ============== ИСТОРИЯ ПАРТИЙ ============== */
var HIST_KEY = "fruitJugHistory";
var HIST_MAX = 10;
var hist = [];
var showRecords = false;
try {
  var raw = storeGet(HIST_KEY);
  hist = raw ? JSON.parse(raw) : [];
  if (!Array.isArray(hist)) hist = [];
} catch(e){ hist = []; }

function pushHistory(){
  hist.unshift({ s:S.score, d:S.cocktails, c:S.crates, n:S.drops, t:Date.now() });
  if (hist.length > HIST_MAX) hist.length = HIST_MAX;
  storeSet(HIST_KEY, JSON.stringify(hist));
}
function plural(n, one, few, many){
  var a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}
function fmtDate(ts){
  var d = new Date(ts), p = function(n){ return (n<10?"0":"") + n; };
  return p(d.getDate()) + "." + p(d.getMonth()+1) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function makeFruit(tier, x, y){
  var d = FRUITS[tier], sh = SHAPES[tier], m = d.r*d.r;
  var g = { tier:tier, x:x, y:y, vx:0, vy:0, r:d.r, m:m, im:1/m, iI:1/(m*sh.k2),
            angle: (Math.random()-0.5)*0.6, spin:0,
            dead:false, state:"live", t:0, pop:1, px:x, py:y, pa:0, rs:999,
            sc:1, wc:new Float64Array(sh.c.length*3) };
  pose(g);
  return g;
}

/* Круги тела в мире: поворот и масштаб (новый фрукт «выдувается» и растёт) */
function pose(g){
  var cs = SHAPES[g.tier].c, w = g.wc, s = g.sc;
  var ca = Math.cos(g.angle)*s, sa = Math.sin(g.angle)*s;
  for (var i=0, j=0; i<cs.length; i++, j+=3){
    var c = cs[i];
    w[j]   = g.x + ca*c[0] - sa*c[1];
    w[j+1] = g.y + sa*c[0] + ca*c[1];
    w[j+2] = c[2]*s;
  }
}
/* верхняя точка тела — по ней судим о переполнении */
function topOf(g){
  var w = g.wc, t = 1e9;
  for (var j=0;j<w.length;j+=3) if (w[j+1] - w[j+2] < t) t = w[j+1] - w[j+2];
  return t;
}

/* ============== БРОСОК ============== */
function dropX(tier){
  var lim = NECK_HW - SHAPES[tier].hw - 3;
  return Math.max(CX - lim, Math.min(CX + lim, S.aimX));
}
function fire(){
  if (S.over || S.left <= 0 || S.cool > 0) return;
  var tier = S.queue.shift();
  S.queue.push(pick());
  var g = makeFruit(tier, dropX(tier), hoverY(tier));
  g.vy = 40;
  g.angle = Math.sin(S.time*2.2)*0.12;
  g.spin = (Math.random()-0.5)*1.2;
  pose(g);
  S.gems.push(g);
  S.drops++;
  S.left--;
  S.cool = DROP_CD;
  sfxDrop();
}

/* ============== ФИЗИКА ==============
   Фрукт — твёрдое тело из нескольких кругов: овальный и вытянутый лежат,
   катятся и переворачиваются по своей форме, а не как шар.

   Шаг устроен «по позициям»: сначала двигаем тела, потом расталкиваем
   пересечения, сдвигая и поворачивая их, и только потом берём скорость
   из фактического сдвига. Поэтому зажатый в куче фрукт стоит со скоростью
   ноль — раньше гравитация копила ему скорость, расталкивание возвращало
   его на место, и он считался «летящим» и мог крутиться без конца.
   Трение покоя держит фрукт на склоне, трение скольжения заставляет
   катиться; отскок — небольшой, стекло о стекло. */
/* Трение подобрано ботами: при 0.35 куча не утрамбовывалась, и кувшин
   переполнялся заметно раньше, чем с прежними круглыми фруктами. */
var MU_S = 0.15, MU_D = 0.08;        /* трение покоя и скольжения между фруктами */
var MU_WALL = 0.18;                  /* стенки кувшина гладкие */
var E_FRUIT = 0.15, E_WALL = 0.3;    /* упругость удара */
var VMAX = 1600, WMAX = 14;          /* потолки скорости и вращения: страховка от рывков */
var CONTACTS = [], NC = 0;

function newContact(){
  if (NC >= CONTACTS.length) CONTACTS.push({});
  return CONTACTS[NC++];
}
/* скорость точки тела, отстоящей от центра на (rx, ry) */
function pvx(g, ry){ return g.vx - g.spin*ry; }
function pvy(g, rx){ return g.vy + g.spin*rx; }

/* Ищем пары кругов, которые касаются или вот-вот коснутся. Список живёт
   один шаг: на нём делаем все итерации расталкивания и затем трение. */
function findContacts(dt){
  NC = 0;
  var gs = S.gems, n = gs.length, i, j, p, q, s, k;
  for (i=0;i<n;i++){
    var a = gs[i];
    if (a.state !== "live" || a.dead) continue;
    var A = a.wc, Ra = SHAPES[a.tier].R*a.sc;
    for (j=i+1;j<n;j++){
      var b = gs[j];
      if (b.state !== "live" || b.dead) continue;
      var dx = b.x - a.x, dy = b.y - a.y, RR = Ra + SHAPES[b.tier].R*b.sc + 2;
      if (dx*dx + dy*dy > RR*RR) continue;
      var B = b.wc;
      for (p=0;p<A.length;p+=3) for (q=0;q<B.length;q+=3){
        var ex = B[q] - A[p], ey = B[q+1] - A[p+1], rr = A[p+2] + B[q+2] + 1;
        var e2 = ex*ex + ey*ey;
        if (e2 >= rr*rr || e2 < 1e-9) continue;
        var e = Math.sqrt(e2), nx = ex/e, ny = ey/e;
        var cx = A[p] + nx*A[p+2], cy = A[p+1] + ny*A[p+2];
        k = newContact();
        k.a = a; k.b = b; k.p = p; k.q = q; k.seg = null; k.ln = 0;
        k.nx = nx; k.ny = ny; k.cx = cx; k.cy = cy;
        /* нормальная скорость сближения до расталкивания — для отскока */
        k.vn0 = (pvx(b, cy - b.y) - pvx(a, cy - a.y))*nx + (pvy(b, cx - b.x) - pvy(a, cx - a.x))*ny;
      }
    }
    /* стенки */
    for (p=0;p<A.length;p+=3){
      var X = A[p], Y = A[p+1], r1 = A[p+2] + 1;
      for (s=0;s<SEGS.length;s++){
        var sg = SEGS[s];
        if (Y + r1 < sg.y0 || Y - r1 > sg.y1 || X + r1 < sg.x0 || X - r1 > sg.x1) continue;
        var t = ((X - sg.ax)*sg.dx + (Y - sg.ay)*sg.dy) / sg.l2;
        t = t < 0 ? 0 : (t > 1 ? 1 : t);
        var wx = X - (sg.ax + sg.dx*t), wy = Y - (sg.ay + sg.dy*t);
        if (wx*wx + wy*wy >= r1*r1) continue;
        k = newContact();
        k.a = a; k.b = null; k.p = p; k.seg = sg; k.ln = 0;
        k.nx = sg.nx; k.ny = sg.ny; k.cx = X; k.cy = Y;
        k.vn0 = pvx(a, Y - a.y)*sg.nx + pvy(a, X - a.x)*sg.ny;
      }
    }
  }
}

/* сдвиг тела позиционным импульсом (jx, jy), приложенным в точке r от центра */
function push(g, jx, jy, rx, ry){
  g.x += jx*g.im; g.y += jy*g.im;
  g.angle += (rx*jy - ry*jx)*g.iI;
  pose(g);
}
/* то же для скорости */
function kick(g, jx, jy, rx, ry){
  g.vx += jx*g.im; g.vy += jy*g.im;
  g.spin += (rx*jy - ry*jx)*g.iI;
}
/* насколько точка тела (cx, cy) сдвинулась за шаг — для трения покоя */
function moved(g, cx, cy){
  var rx = cx - g.x, ry = cy - g.y, da = g.angle - g.pa;
  var c = Math.cos(da), s = Math.sin(da);
  return [g.x - g.px + rx - (c*rx + s*ry), g.y - g.py + ry - (-s*rx + c*ry)];
}
/* трение покоя: если точки касания проскользнули меньше, чем позволяет
   прижатие, — возвращаем их друг к другу, и тело не едет, а катится */
function holdFriction(k, a, b, nx, ny, cx, cy, mu){
  var ma = moved(a, cx, cy), dx = ma[0], dy = ma[1];
  if (b){ var mb = moved(b, cx, cy); dx -= mb[0]; dy -= mb[1]; }
  var dn = dx*nx + dy*ny, tx = dx - dn*nx, ty = dy - dn*ny;
  var lt = Math.sqrt(tx*tx + ty*ty);
  if (lt < 1e-6) return;
  tx /= lt; ty /= lt;
  var rax = cx - a.x, ray = cy - a.y, ra = rax*ty - ray*tx;
  var w = a.im + ra*ra*a.iI, rbx = 0, rby = 0;
  if (b){ rbx = cx - b.x; rby = cy - b.y; var rb = rbx*ty - rby*tx; w += b.im + rb*rb*b.iI; }
  var dl = lt / w;
  if (dl > mu*k.ln) return;           /* прижатие не держит — пусть скользит */
  push(a, -tx*dl, -ty*dl, rax, ray);
  if (b) push(b, tx*dl, ty*dl, rbx, rby);
}

function solvePair(k){
  var a = k.a, b = k.b, A = a.wc, B = b.wc, p = k.p, q = k.q;
  var dx = B[q] - A[p], dy = B[q+1] - A[p+1], rr = A[p+2] + B[q+2], d2 = dx*dx + dy*dy;
  if (d2 >= rr*rr || d2 < 1e-9) return;
  var d = Math.sqrt(d2), nx = dx/d, ny = dy/d, pen = rr - d;
  var cx = A[p] + nx*(A[p+2] - pen/2), cy = A[p+1] + ny*(A[p+2] - pen/2);
  var rax = cx - a.x, ray = cy - a.y, rbx = cx - b.x, rby = cy - b.y;
  var ra = rax*ny - ray*nx, rb = rbx*ny - rby*nx;
  var dl = pen / (a.im + ra*ra*a.iI + b.im + rb*rb*b.iI);
  k.ln += dl; k.nx = nx; k.ny = ny; k.cx = cx; k.cy = cy;
  push(a, -nx*dl, -ny*dl, rax, ray);
  push(b, nx*dl, ny*dl, rbx, rby);
  holdFriction(k, a, b, nx, ny, cx, cy, MU_S);
}

function solveWall(k){
  var g = k.a, A = g.wc, p = k.p, s = k.seg;
  var X = A[p], Y = A[p+1], r = A[p+2];
  var t = ((X - s.ax)*s.dx + (Y - s.ay)*s.dy) / s.l2;
  var inner = t > 0 && t < 1;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  var ex = X - (s.ax + s.dx*t), ey = Y - (s.ay + s.dy*t);
  var d = Math.sqrt(ex*ex + ey*ey);
  if (d >= r) return;
  var nx, ny, pen;
  /* центр круга проскочил за стенку — выталкиваем по нормали отрезка.
     Только для середины отрезка: у концов «сзади» бывает и законно внутри. */
  if (inner && ex*s.nx + ey*s.ny < 0){ nx = s.nx; ny = s.ny; pen = r + d; }
  else if (d < 1e-6){ nx = s.nx; ny = s.ny; pen = r; }
  else { nx = ex/d; ny = ey/d; pen = r - d; }
  var cx = X - nx*(r - pen/2), cy = Y - ny*(r - pen/2);
  var rx = cx - g.x, ry = cy - g.y, rn = rx*ny - ry*nx;
  var dl = pen / (g.im + rn*rn*g.iI);
  k.ln += dl; k.nx = nx; k.ny = ny; k.cx = cx; k.cy = cy;
  push(g, nx*dl, ny*dl, rx, ry);
  holdFriction(k, g, null, nx, ny, cx, cy, MU_WALL);
}

/* После расталкивания: отскок и трение скольжения по скоростям */
function bounceAndSlide(k, dt){
  if (k.ln <= 0) return;
  /* Всё считаем как «b относительно a», нормаль — от a к b. Стенка — это
     неподвижное b; её нормаль смотрит от стенки к фрукту, поэтому разворачиваем. */
  var a = k.a, b = k.b, cx = k.cx, cy = k.cy;
  var nx = b ? k.nx : -k.nx, ny = b ? k.ny : -k.ny, vn0 = b ? k.vn0 : -k.vn0;
  var rax = cx - a.x, ray = cy - a.y, rbx = 0, rby = 0, ux, uy;
  if (b){
    rbx = cx - b.x; rby = cy - b.y;
    ux = pvx(b, rby) - pvx(a, ray); uy = pvy(b, rbx) - pvy(a, rax);
  } else { ux = -pvx(a, ray); uy = -pvy(a, rax); }
  var un = ux*nx + uy*ny;               /* < 0 — сближаются */
  var ra = rax*ny - ray*nx, wn = a.im + ra*ra*a.iI;
  if (b){ var rb = rbx*ny - rby*nx; wn += b.im + rb*rb*b.iI; }
  /* отскок — только от настоящего удара, а не от веса соседа сверху */
  var e = -vn0 > 2*GRAV*dt ? (b ? E_FRUIT : E_WALL) : 0;
  var target = Math.max(0, -e*vn0);
  if (-vn0 > (b ? 320 : 260)) clink(-vn0);
  if (un < target){
    var J = (target - un) / wn;
    kick(a, -nx*J, -ny*J, rax, ray);
    if (b) kick(b, nx*J, ny*J, rbx, rby);
    un = target;
  }
  var tx = ux - un*nx, ty = uy - un*ny, ut = Math.sqrt(tx*tx + ty*ty);
  if (ut < 1e-6) return;
  tx /= ut; ty /= ut;
  var rat = rax*ty - ray*tx, wt = a.im + rat*rat*a.iI;
  if (b){ var rbt = rbx*ty - rby*tx; wt += b.im + rbt*rbt*b.iI; }
  var Jt = Math.min(ut / wt, (b ? MU_D : MU_WALL) * k.ln / dt);
  /* гасим относительное скольжение: a — вдоль него, b — против */
  kick(a, tx*Jt, ty*Jt, rax, ray);
  if (b) kick(b, -tx*Jt, -ty*Jt, rbx, rby);
}

function physics(dt){
  var gs = S.gems, i, it, g;
  for (i=0;i<gs.length;i++){
    g = gs[i];
    g.t += dt;
    if (g.pop < 1){ g.pop = Math.min(1, g.pop + dt/0.2); }
    g.sc = 0.6 + 0.4*g.pop;
    g.px = g.x; g.py = g.y; g.pa = g.angle;
    g.vy += GRAV*dt;
    g.vx *= 0.9985;
    g.spin *= 0.995;
    g.x += g.vx*dt; g.y += g.vy*dt;
    g.angle += g.spin*dt;
    pose(g);
  }
  findContacts(dt);
  for (it=0; it<4; it++){
    for (i=0;i<NC;i++){ var k = CONTACTS[i]; if (k.b) solvePair(k); else solveWall(k); }
  }
  for (i=0;i<gs.length;i++){
    g = gs[i];
    /* страховка: что бы ни случилось, центр фрукта остаётся в кувшине */
    if (g.y > RIM_Y){
      var hw = hwAt(g.y);
      if (g.x < CX - hw) g.x = CX - hw + g.r*0.5;
      if (g.x > CX + hw) g.x = CX + hw - g.r*0.5;
    }
    if (g.y > BOTTOM_Y) g.y = BOTTOM_Y - g.r;
    pose(g);
    /* скорость — из фактического сдвига за шаг */
    g.vx = (g.x - g.px)/dt; g.vy = (g.y - g.py)/dt; g.spin = (g.angle - g.pa)/dt;
    var v = Math.sqrt(g.vx*g.vx + g.vy*g.vy);
    if (v > VMAX){ g.vx *= VMAX/v; g.vy *= VMAX/v; }
  }
  for (i=0;i<NC;i++) bounceAndSlide(CONTACTS[i], dt);
  for (i=0;i<gs.length;i++){
    g = gs[i];
    if (g.spin > WMAX) g.spin = WMAX; else if (g.spin < -WMAX) g.spin = -WMAX;
    /* Реальная скорость — по фактическому сдвигу за шаг, сглаженная:
       по ней решаем, улёгся ли фрукт (переполнение, конец партии). */
    var mv = Math.sqrt((g.x - g.px)*(g.x - g.px) + (g.y - g.py)*(g.y - g.py)) / dt;
    g.rs += (mv - g.rs) * 0.08;
    /* улёгшийся фрукт не дрожит поворотом на месте */
    if (g.rs < 12) g.spin *= 0.9;
  }
  for (i=0;i<NC;i++){ CONTACTS[i].a = CONTACTS[i].b = null; }
  mergePass();
  cratePass();
  var alive = [];
  for (i=0;i<S.gems.length;i++) if (!S.gems[i].dead) alive.push(S.gems[i]);
  S.gems = alive;
}

/* ящик выпадает при слиянии; кувыркается и вскрывается, когда уляжется */
function spawnCrate(x, y){
  var c = makeFruit(0, x, y - 12);
  c.vx = (Math.random()-0.5)*240;
  c.vy = -340 - Math.random()*130;
  c.spin = (Math.random()-0.5)*7;
  c.pop = 0; c.sc = 0.6; pose(c);
  S.gems.push(c);
  burst(x, y, "#ffd75e", 14, 210);
}
function cratePass(){
  var gs = S.gems, i;
  for (i=0;i<gs.length;i++){
    var c = gs[i];
    if (c.tier !== 0 || c.dead || c.state !== "live") continue;
    var slow = Math.abs(c.vx) + Math.abs(c.vy) < 70;
    if ((c.t > 0.5 && slow) || c.t > 6) openCrate(c);
  }
}
function openCrate(c){
  c.dead = true;
  S.left += CRATE_BONUS;
  S.score += CRATE_SCORE;
  S.crates++; S.crateFlash = 1.6;
  burst(c.x, c.y, "#ffd75e", 36, 320);
  burst(c.x, c.y, "#fff3c4", 18, 170);
  pop(c.x, c.y - 52, "+" + CRATE_BONUS + " ФРУКТОВ", "#ffe9a8", 24);
  pop(c.x, c.y - 20, "+" + CRATE_SCORE, "#fff3c4", 18);
  S.shake = 8; S.flash = 0.45;
  sfxCrate();
}

function mergePass(){
  var gs = S.gems, i, j;
  for (i=0;i<gs.length;i++){
    var a = gs[i];
    if (a.state!=="live" || a.dead || a.tier === 0) continue;
    for (j=i+1;j<gs.length;j++){
      var b = gs[j];
      if (b.state!=="live" || b.dead) continue;
      if (a.tier !== b.tier) continue;
      /* Зажатые в куче фрукты иногда замирают в паре пикселей друг от друга:
         на глаз они касаются, а тела — нет. Сливаем и с таким зазором. */
      var tol = Math.max(2, 0.08*a.r);
      if (gapBetween(a, b, tol) <= tol){ doMerge(a,b); break; }
    }
  }
}
/* наименьший зазор между телами (меньше нуля — пересекаются);
   дальние пары отсекаем по описанным окружностям */
function gapBetween(a, b, tol){
  var dx = b.x - a.x, dy = b.y - a.y, RR = SHAPES[a.tier].R*a.sc + SHAPES[b.tier].R*b.sc + tol;
  if (dx*dx + dy*dy > RR*RR) return 1e9;
  var A = a.wc, B = b.wc, best = 1e9;
  for (var p=0;p<A.length;p+=3) for (var q=0;q<B.length;q+=3){
    var ex = B[q] - A[p], ey = B[q+1] - A[p+1];
    var g = Math.sqrt(ex*ex + ey*ey) - A[p+2] - B[q+2];
    if (g < best) best = g;
  }
  return best;
}

function doMerge(a, b){
  a.dead = true; b.dead = true;
  var x = (a.x + b.x)/2, y = (a.y + b.y)/2;
  shatter(a); shatter(b);
  S.merges++;

  /* Два арбуза — джекпот: оба вдребезги, и в кувшине разом становится просторно */
  if (a.tier === TOP){
    S.jackpots++; S.score += JACKPOT; S.flash = 1; S.shake = 12;
    shockwave(x, y);
    ring(x, y, a.r*1.2, [255,255,255]);
    burst(x, y, "#ffffff", 46, 440);
    pop(x, y-42, "ДЖЕКПОТ!", "#fff3b0", 32);
    pop(x, y-4, "+" + JACKPOT, "#ffe9a8", 26);
    sfxShatter(TOP); sfxMelon();
    return;
  }

  var nt = a.tier + 1;
  var g = makeFruit(nt, x, y);
  g.vx = (a.vx + b.vx)*0.25;
  g.vy = (a.vy + b.vy)*0.25 - 40;
  g.pop = 0; g.sc = 0.6; pose(g);
  var d = FRUITS[nt];
  ring(x, y, (a.r + b.r)*0.6, d.l);

  if (nt === TOP){
    /* каждый собранный арбуз — коктейль: он вылетает к счётчику наверху */
    S.cocktails++; S.flash = 0.5; S.shake = 8;
    S.flyers.push({ x:x, y:y, t:0 });
    burst(x, y, "#e6ffe0", 30, 320);
    pop(x, y-42, "КОКТЕЙЛЬ!", "#ffd6ea", 28);
    pop(x, y-4, "+" + SCORES[TOP], "#ffe9a8", 24);
    sfxMelon();
  } else {
    pop(x, y, "+" + SCORES[nt], rgba(d.l, 1), 15 + nt*2);
    S.shake = Math.min(8, 1 + nt*1.3);
  }
  S.gems.push(g);
  S.score += SCORES[nt];
  sfxShatter(a.tier);
  if (Math.random() < CRATE_CHANCE) spawnCrate(x, y);
}

function shockwave(x, y){
  for (var i=0;i<S.gems.length;i++){
    var o = S.gems[i];
    if (o.state!=="live" || o.dead) continue;
    var dx = o.x-x, dy = o.y-y, d = Math.sqrt(dx*dx+dy*dy) || 1;
    if (d < 190){
      var f = (1 - d/190) * 900;
      o.vx += dx/d*f; o.vy += dy/d*f - 60;
      o.spin += (Math.random()-0.5)*8;
    }
  }
}

/* ============== ОСКОЛКИ И ЧАСТИЦЫ ============== */
var SHARD_MAX = 320;
function shatter(g){
  var d = FRUITS[g.tier], n = 8 + g.tier*4, i, j;
  var cs = SHAPES[g.tier].c, ca = Math.cos(g.angle), sa = Math.sin(g.angle), tot = 0;
  for (i=0;i<cs.length;i++) tot += cs[i][2]*cs[i][2];
  for (i=0;i<n;i++){
    /* точка внутри тела: круг — по площади, место в нём — равномерно */
    var pick = Math.random()*tot, c = cs[0];
    for (j=0;j<cs.length;j++){ pick -= cs[j][2]*cs[j][2]; if (pick <= 0){ c = cs[j]; break; } }
    var u = Math.random()*6.283, rr = c[2]*Math.sqrt(Math.random())*0.85;
    var lx = c[0] + Math.cos(u)*rr, ly = c[1] + Math.sin(u)*rr;
    var wx = ca*lx - sa*ly, wy = sa*lx + ca*ly;
    /* летит от центра фрукта */
    var a = (wx*wx + wy*wy > 4) ? Math.atan2(wy, wx) : Math.random()*6.283;
    var sp = (140 + Math.random()*330) * (0.8 + g.tier*0.07);
    var s = Math.max(4, g.r*(0.14 + Math.random()*0.18));
    var k = Math.random() < 0.4 ? 4 : 3, pts = [];
    for (j=0;j<k;j++){
      var aa = j*6.283/k + (Math.random()-0.5)*1.1;
      var rad = s*(0.45 + Math.random()*0.7);
      pts.push(Math.cos(aa)*rad, Math.sin(aa)*rad);
    }
    /* rot начинается с угла фрукта: осколок — кусок картинки ровно с того
       места, где он был, и дальше кувыркается сам */
    S.shards.push({ x:g.x + wx, y:g.y + wy, tier:g.tier, lx:lx, ly:ly,
      vx:Math.cos(a)*sp + g.vx*0.3, vy:Math.sin(a)*sp - 170 + g.vy*0.3,
      rot:g.angle, spin:(Math.random()-0.5)*18, pts:pts,
      fill:rgba(d.c, 0.62), edge:rgba(d.l, 0.95), life:0, max:0.9 + Math.random()*0.7 });
  }
  if (S.shards.length > SHARD_MAX) S.shards.splice(0, S.shards.length - SHARD_MAX);
  /* брызги сока и блёстки */
  burst(g.x, g.y, rgba(d.c, 1), 5 + g.tier*2, 110 + g.tier*30);
  for (i=0;i<3 + g.tier;i++){
    var b = Math.random()*6.283, v = 60 + Math.random()*200;
    S.parts.push({ x:g.x, y:g.y, vx:Math.cos(b)*v, vy:Math.sin(b)*v - 80, life:0,
      max:0.5 + Math.random()*0.5, s:3 + Math.random()*4, c:"#ffffff", star:true });
  }
}
function burst(x, y, color, n, spd){
  spd = spd || 200;
  for (var i=0;i<n;i++){
    var a = Math.random()*6.283, v = spd*(0.35+Math.random()*0.9);
    S.parts.push({ x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 60,
      life:0, max:0.45+Math.random()*0.6, s:1.6+Math.random()*3.2, c:color });
  }
}
function ring(x, y, r, c){ S.rings.push({ x:x, y:y, r:r, c:rgba(c, 1), life:0, max:0.35 }); }
function pop(x, y, text, color, size){
  S.pops.push({ x:x, y:y, text:text, color:color, size:size||16, life:0, max:1.25 });
}
function updateFx(dt){
  var i, keep = [];
  for (i=0;i<S.parts.length;i++){
    var p = S.parts[i];
    p.life += dt; p.vy += 620*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.97;
    if (p.life < p.max) keep.push(p);
  }
  S.parts = keep;

  /* осколки падают, отскакивают от стенок и дна и тают */
  keep = [];
  for (i=0;i<S.shards.length;i++){
    var s = S.shards[i];
    s.life += dt;
    s.vy += 1300*dt; s.vx *= 0.99;
    s.x += s.vx*dt; s.y += s.vy*dt; s.rot += s.spin*dt;
    if (s.y > RIM_Y){
      var hw = hwAt(s.y) - 3;
      if (s.x < CX - hw){ s.x = CX - hw; s.vx = Math.abs(s.vx)*0.35; }
      if (s.x > CX + hw){ s.x = CX + hw; s.vx = -Math.abs(s.vx)*0.35; }
      if (s.y > BOTTOM_Y - 3){ s.y = BOTTOM_Y - 3; s.vy = -Math.abs(s.vy)*0.25; s.vx *= 0.7; s.spin *= 0.5; }
    }
    if (s.life < s.max) keep.push(s);
  }
  S.shards = keep;

  keep = [];
  for (i=0;i<S.rings.length;i++){ var r = S.rings[i]; r.life += dt; if (r.life < r.max) keep.push(r); }
  S.rings = keep;

  keep = [];
  for (i=0;i<S.pops.length;i++){
    var q = S.pops[i];
    q.life += dt; q.y -= 42*dt;
    if (q.life < q.max) keep.push(q);
  }
  S.pops = keep;

  /* коктейль летит из кувшина к табличке; долетел — счётчик подпрыгивает */
  keep = [];
  for (i=0;i<S.flyers.length;i++){
    var f = S.flyers[i];
    f.t += dt/0.8;
    if (f.t < 1) keep.push(f);
    else { S.cocktailBump = 0.4; tone(1568, 0.25, "sine", 0.08); tone(2093, 0.3, "sine", 0.06, 0.06); }
  }
  S.flyers = keep;
  S.cocktailBump = Math.max(0, S.cocktailBump - dt);
}

/* куда упадёт фрукт: верх кучи под прицелом или дно */
/* Возвращает, где окажется центр фрукта: опускаем его форму (без поворота)
   по вертикали, пока какой-нибудь её круг не коснётся кучи, дна или бока. */
function landingY(x, tier){
  var sh = SHAPES[tier], fc = sh.c, y = BOTTOM_Y - sh.bot, i, f, p;
  for (i=0;i<S.gems.length;i++){
    var g = S.gems[i];
    if (g.state !== "live" || g.dead) continue;
    if (Math.abs(g.x - x) > SHAPES[g.tier].R + sh.R) continue;
    var w = g.wc;
    for (f=0;f<fc.length;f++) for (p=0;p<w.length;p+=3){
      var dx = w[p] - (x + fc[f][0]), R = w[p+2] + fc[f][2];
      if (Math.abs(dx) >= R) continue;
      var cy = w[p+1] - Math.sqrt(R*R - dx*dx) - fc[f][1];
      if (cy < y) y = cy;
    }
  }
  for (var yy = 380; yy < y + sh.bot; yy += 3){
    if (Math.abs(x - CX) + sh.hw > hwAt(yy)){ y = yy - sh.bot; break; }
  }
  return Math.max(hoverY(tier), y);
}

/* ============== ОТРИСОВКА ФРУКТОВ ==============
   Каждый фрукт — стеклянный: полупрозрачное тело с тёмной кромкой, свет,
   собравшийся у дна (каустика), и блики. Тело вращается вместе с фруктом,
   а блики — отдельный спрайт, который не крутится: свет падает всегда слева сверху. */
function star4(x, y, s, alpha){
  ctx.save(); ctx.translate(x,y); ctx.globalAlpha *= alpha;
  ctx.fillStyle = "#fff"; ctx.beginPath();
  ctx.moveTo(0,-s); ctx.quadraticCurveTo(s*0.16,-s*0.16, s,0);
  ctx.quadraticCurveTo(s*0.16,s*0.16, 0,s);
  ctx.quadraticCurveTo(-s*0.16,s*0.16, -s,0);
  ctx.quadraticCurveTo(-s*0.16,-s*0.16, 0,-s);
  ctx.fill(); ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* габарит тела: центр и полуоси — по нему строятся градиенты и блики */
function bodyBox(tier, r){
  switch(tier){
    case 2: return [0, 0.06*r, 0.92*r, 0.9*r];
    /* Физика считает фрукт кругом радиуса r, поэтому тело почти заполняет
       этот круг: у узкого овала соседи лежали бы на «пустом воздухе». */
    case 3: return [0, 0, r, 0.94*r];
    case 5: return [0, 0.03*r, 0.92*r, 0.97*r];
    case 6: return [0, 0.05*r, 0.94*r, 0.95*r];
    default: return [0, 0, r, r];
  }
}
function bodyPath(tier, r){
  ctx.beginPath();
  if (tier === 2){
    ctx.moveTo(0,-0.72*r);
    ctx.bezierCurveTo( 0.55*r,-0.98*r,  1.08*r,-0.55*r,  0.92*r,0);
    ctx.bezierCurveTo( 0.78*r, 0.52*r,  0.32*r, 0.95*r,  0, 1.0*r);
    ctx.bezierCurveTo(-0.32*r, 0.95*r, -0.78*r, 0.52*r, -0.92*r,0);
    ctx.bezierCurveTo(-1.08*r,-0.55*r, -0.55*r,-0.98*r,  0,-0.72*r);
    ctx.closePath();
  } else if (tier === 3 || tier === 5 || tier === 6){
    var b = bodyBox(tier, r);
    ctx.ellipse(b[0], b[1], b[2], b[3], 0, 0, 6.283);
  } else {
    ctx.arc(0, 0, r, 0, 6.283);
  }
}
function glassLeaf(x, y, len, w, ang){
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(w, -len*0.45, 0, -len);
  ctx.quadraticCurveTo(-w, -len*0.45, 0, 0);
  ctx.closePath();
  var g = ctx.createLinearGradient(-w, 0, w, 0);
  g.addColorStop(0, "rgba(60,150,50,.85)"); g.addColorStop(0.5, "rgba(170,240,140,.8)"); g.addColorStop(1, "rgba(40,120,40,.88)");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(20,80,20,.75)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = "rgba(230,255,210,.55)"; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(0, -len*0.1); ctx.lineTo(0, -len*0.85); ctx.stroke();
  ctx.restore();
}
function dots(r, n, color, size, box){
  ctx.fillStyle = color;
  for (var i=0;i<n;i++){
    var a = Math.random()*6.283, q = Math.sqrt(Math.random());
    ctx.beginPath();
    ctx.arc(box[0] + Math.cos(a)*q*box[2], box[1] + Math.sin(a)*q*box[3], size*(0.6+Math.random()*0.6), 0, 6.283);
    ctx.fill();
  }
}

/* мягкое пятно цвета, тающее к краю */
function spot(x, y, rad, col){
  var g = ctx.createRadialGradient(x, y, 0, x, y, rad);
  g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, 2*rad, 2*rad);
}
/* пузырьки воздуха, застывшие в стекле */
function bubbles(box, n){
  for (var i=0;i<n;i++){
    var a = Math.random()*6.283, q = 0.2 + Math.random()*0.6;
    var x = box[0] + Math.cos(a)*q*box[2], y = box[1] + Math.sin(a)*q*box[3];
    var s = Math.max(1.2, Math.min(box[2], box[3]) * (0.025 + Math.random()*0.04));
    ctx.beginPath(); ctx.arc(x, y, s, 0, 6.283);
    ctx.fillStyle = "rgba(255,255,255,.10)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath(); ctx.arc(x - s*0.35, y - s*0.35, s*0.3, 0, 6.283); ctx.fill();
  }
}
/* дольки цитруса внутри и светлый слой под кожурой */
function citrus(box, n, d){
  var cx = box[0], cy = box[1], rx = box[2]*0.66, ry = box[3]*0.66, i;
  for (i=0;i<n;i++){
    var a0 = i*6.283/n, a1 = (i+1)*6.283/n;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos((a0+a1)/2)*rx*0.1, cy + Math.sin((a0+a1)/2)*ry*0.1);
    ctx.ellipse(cx, cy, rx, ry, 0, a0 + 0.07, a1 - 0.07);
    ctx.closePath();
    ctx.fillStyle = rgba(d.l, (i % 2) ? 0.16 : 0.26); ctx.fill();
    ctx.strokeStyle = rgba(d.l, 0.42); ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.strokeStyle = rgba(d.l, 0.26); ctx.lineWidth = Math.max(1.5, box[2]*0.06);
  ctx.beginPath(); ctx.ellipse(cx, cy, rx*1.1, ry*1.1, 0, 0, 6.283); ctx.stroke();
}
/* пористая кожура: тёмная ямка и блик сверху-слева у каждой поры */
function peel(box, n, d, s){
  for (var i=0;i<n;i++){
    var a = Math.random()*6.283, q = Math.sqrt(Math.random());
    var x = box[0] + Math.cos(a)*q*box[2], y = box[1] + Math.sin(a)*q*box[3];
    ctx.fillStyle = rgba(d.d, 0.24); ctx.beginPath(); ctx.arc(x, y, s, 0, 6.283); ctx.fill();
    ctx.fillStyle = rgba(d.l, 0.32); ctx.beginPath(); ctx.arc(x - s*0.4, y - s*0.4, s*0.5, 0, 6.283); ctx.fill();
  }
}
/* чешуйка драгонфрукта: широкий плоский «язычок пламени», кончик загнут вбок (curl = ±1) */
function bract(x, y, len, w, ang, curl){
  var tx = curl*len*0.22;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(-w, 0);
  ctx.quadraticCurveTo(-w*0.95, -len*0.62, tx, -len);
  ctx.quadraticCurveTo(w*0.6, -len*0.5, w, 0);
  ctx.quadraticCurveTo(0, -len*0.12, -w, 0);
  ctx.closePath();
  var g = ctx.createLinearGradient(0, 0, tx, -len);
  g.addColorStop(0, "rgba(200,20,110,.92)"); g.addColorStop(0.5, "rgba(255,95,170,.9)");
  g.addColorStop(0.82, "rgba(235,200,110,.92)"); g.addColorStop(1, "rgba(170,225,80,.96)");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(110,0,55,.55)"; ctx.lineWidth = 0.9; ctx.stroke();
  ctx.strokeStyle = "rgba(255,230,245,.5)"; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(0, -len*0.1); ctx.quadraticCurveTo(-w*0.1, -len*0.55, tx*0.8, -len*0.85); ctx.stroke();
  ctx.restore();
}

function drawFruitBody(tier, r){
  var d = FRUITS[tier], box = bodyBox(tier, r), bx = box[1], i, k, m;
  var R = Math.max(box[2], box[3]);

  /* стебельки и листья, торчащие за тело, — позади стекла */
  if (tier === 1){
    ctx.strokeStyle = "rgba(110,150,50,.9)"; ctx.lineWidth = 0.17*r; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0,-0.8*r); ctx.quadraticCurveTo(0.05*r,-1.4*r, 0.42*r,-1.75*r); ctx.stroke();
    ctx.strokeStyle = "rgba(220,255,170,.6)"; ctx.lineWidth = 0.06*r;
    ctx.beginPath(); ctx.moveTo(-0.03*r,-0.85*r); ctx.quadraticCurveTo(0.02*r,-1.4*r, 0.36*r,-1.7*r); ctx.stroke();
    ctx.lineCap = "butt";
    glassLeaf(0.38*r, -1.66*r, 0.9*r, 0.32*r, 1.15);
  }
  if (tier === 6){
    /* корона почти целиком внутри круга столкновений: иначе ананасы
       «касаются» листьями, а для физики между ними ещё зазор */
    var L = [[-0.95,0.22],[-0.55,0.28],[-0.22,0.33],[0,0.35],[0.22,0.33],[0.55,0.28],[0.95,0.22]];
    for (i=0;i<L.length;i++) glassLeaf(L[i][0]*0.14*r, -0.8*r, L[i][1]*r, 0.11*r, L[i][0]*0.75);
  }

  /* тело */
  bodyPath(tier, r);
  var g = ctx.createRadialGradient(box[0]-0.28*box[2], bx-0.32*box[3], 0.05*R, box[0], bx, 1.05*R);
  g.addColorStop(0, rgba(d.l, 0.82));
  g.addColorStop(0.45, rgba(d.c, 0.62));
  g.addColorStop(0.82, rgba(d.c, 0.72));
  g.addColorStop(1, rgba(d.d, 0.92));
  ctx.fillStyle = g; ctx.fill();

  ctx.save();
  bodyPath(tier, r); ctx.clip();
  ctx.shadowColor = "rgba(0,0,0,0)";
  if (tier === 1){
    /* шов от ямки стебля вниз по боку и тень в самой ямке */
    ctx.lineCap = "round";
    ctx.strokeStyle = rgba(d.d, 0.4); ctx.lineWidth = 0.07*r;
    ctx.beginPath(); ctx.moveTo(0.02*r,-0.78*r); ctx.bezierCurveTo(0.38*r,-0.4*r, 0.42*r,0.35*r, 0.12*r,0.86*r); ctx.stroke();
    ctx.strokeStyle = rgba(d.l, 0.32); ctx.lineWidth = 0.03*r;
    ctx.beginPath(); ctx.moveTo(-0.04*r,-0.74*r); ctx.bezierCurveTo(0.31*r,-0.38*r, 0.35*r,0.33*r, 0.06*r,0.84*r); ctx.stroke();
    ctx.lineCap = "butt";
    spot(0, -0.82*r, 0.34*r, rgba(d.d, 0.55));
    bubbles(box, 3);
  } else if (tier === 2){
    /* светлые «плечики» под чашелистиком и семечки в ямках */
    spot(0, -0.62*r, 0.62*r, "rgba(255,235,235,.35)");
    for (k=-3;k<=3;k++) for (m=-2;m<=2;m++){
      var sx = m*0.36*r + ((k & 1) ? 0.18*r : 0), sy = k*0.27*r + 0.12*r;
      ctx.fillStyle = rgba(d.d, 0.5);
      ctx.beginPath(); ctx.ellipse(sx, sy + 0.02*r, 0.07*r, 0.11*r, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = "rgba(255,236,140,.92)";
      ctx.beginPath(); ctx.ellipse(sx, sy - 0.01*r, 0.04*r, 0.075*r, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.beginPath(); ctx.arc(sx - 0.012*r, sy - 0.045*r, 0.016*r, 0, 6.283); ctx.fill();
    }
    bubbles(box, 3);
  } else if (tier === 3 || tier === 4){
    /* дольки внутри видны сквозь стекло, кожура в мелких порах */
    citrus(box, tier === 3 ? 9 : 11, d);
    peel(box, tier === 3 ? 90 : 150, d, (tier === 3 ? 0.03 : 0.022)*r);
    bubbles(box, 5);
  } else if (tier === 5){
    /* драгонфрукт: сквозь розовое стекло просвечивает белая мякоть в чёрных семечках */
    var fl = ctx.createRadialGradient(0, bx, 0.05*r, 0, bx, 0.66*r);
    fl.addColorStop(0, "rgba(255,255,255,.5)"); fl.addColorStop(0.75, "rgba(255,240,248,.32)"); fl.addColorStop(1, "rgba(255,240,248,0)");
    ctx.fillStyle = fl; ctx.beginPath(); ctx.ellipse(0, bx, 0.62*r, 0.7*r, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(30,8,24,.62)";
    for (i=0;i<80;i++){
      var sa = Math.random()*6.283, sq = Math.sqrt(Math.random());
      ctx.beginPath();
      ctx.ellipse(Math.cos(sa)*sq*0.52*r, bx + Math.sin(sa)*sq*0.6*r, 0.022*r, 0.034*r, sa, 0, 6.283);
      ctx.fill();
    }
    bubbles(box, 4);
  } else if (tier === 6){
    /* ромбики-«глазки» с тенью снизу и колючкой, поверх — сетка */
    var s = 0.3*r, h = s/2*0.9;
    for (k=-6;k<=6;k++) for (m=-6;m<=6;m++){
      var ex = (k+m+1)*s/2, ey = bx + (m-k)*s/2;
      if (Math.abs(ex) > r || Math.abs(ey - bx) > r) continue;
      ctx.beginPath(); ctx.moveTo(ex, ey - h); ctx.lineTo(ex + h, ey); ctx.lineTo(ex, ey + h); ctx.lineTo(ex - h, ey); ctx.closePath();
      var cg2 = ctx.createLinearGradient(0, ey - h, 0, ey + h);
      cg2.addColorStop(0, rgba(d.l, 0.4)); cg2.addColorStop(1, rgba(d.d, 0.3));
      ctx.fillStyle = cg2; ctx.fill();
      ctx.strokeStyle = rgba(d.d, 0.75); ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.arc(ex, ey + s*0.06, s*0.14, 0.2*Math.PI, 0.8*Math.PI); ctx.stroke();
      ctx.strokeStyle = rgba(d.l, 0.85); ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex + s*0.04, ey - s*0.22); ctx.stroke();
    }
    ctx.strokeStyle = rgba(d.d, 0.6); ctx.lineWidth = 1.4;
    for (k=-7;k<=7;k++){
      ctx.beginPath(); ctx.moveTo(k*s - 1.5*r, bx - 1.5*r); ctx.lineTo(k*s + 1.5*r, bx + 1.5*r); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(k*s + 1.5*r, bx - 1.5*r); ctx.lineTo(k*s - 1.5*r, bx + 1.5*r); ctx.stroke();
    }
    bubbles(box, 4);
  } else if (tier === 7){
    /* под коркой просвечивают красная мякоть и кольцо косточек */
    spot(0, 0.04*r, 0.72*r, "rgba(255,60,90,.48)");
    ctx.fillStyle = "rgba(35,10,12,.55)";
    for (i=0;i<12;i++){
      var wa = i*6.283/12 + 0.2, wr = (0.4 + (i % 2)*0.1)*r;
      ctx.beginPath(); ctx.ellipse(Math.cos(wa)*wr, Math.sin(wa)*wr, 0.06*r, 0.034*r, wa, 0, 6.283); ctx.fill();
    }
    dots(r, 90, rgba(d.l, 0.16), 0.035*r, box);
    bubbles(box, 6);
    ctx.strokeStyle = rgba(d.d, 0.72); ctx.lineWidth = 0.12*r; ctx.lineJoin = "round";
    for (k=-3;k<=3;k++){
      ctx.beginPath();
      for (i=0;i<=24;i++){
        var yy = -r + i*(2*r/24);
        var xx = k*0.29*r*Math.sqrt(Math.max(0, 1 - (yy/r)*(yy/r))) + Math.sin(yy/r*9 + k*1.7)*0.045*r;
        if (i) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy);
      }
      ctx.stroke();
    }
  }
  /* свет, прошедший сквозь стекло, собирается у нижнего края */
  var cg = ctx.createRadialGradient(box[0]+0.2*box[2], bx+0.55*box[3], 0.02*R, box[0]+0.2*box[2], bx+0.55*box[3], 0.55*R);
  cg.addColorStop(0, rgba(d.l, 0.65)); cg.addColorStop(1, rgba(d.l, 0));
  ctx.fillStyle = cg; ctx.fillRect(-1.5*r, -1.5*r, 3*r, 3*r);
  /* толстая стеклянная кромка темнее середины */
  bodyPath(tier, r);
  ctx.strokeStyle = rgba(d.d, 0.45); ctx.lineWidth = 0.18*R; ctx.stroke();
  ctx.restore();

  bodyPath(tier, r);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1.2; ctx.stroke();

  /* детали поверх тела */
  if (tier === 2){
    for (i=0;i<6;i++) glassLeaf(0, -0.68*r, 0.42*r, 0.12*r, 1.9 + i*0.5 - 1.25 + Math.PI);
    ctx.strokeStyle = "rgba(90,150,50,.9)"; ctx.lineWidth = 0.1*r; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0,-0.7*r); ctx.lineTo(0.06*r,-1.0*r); ctx.stroke(); ctx.lineCap = "butt";
  } else if (tier === 3){
    ctx.fillStyle = rgba(d.d, 0.7);
    ctx.beginPath(); ctx.ellipse( 0.98*r, 0, 0.08*r, 0.1*r, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-0.98*r, 0, 0.08*r, 0.1*r, 0, 0, 6.283); ctx.fill();
  } else if (tier === 4){
    ctx.fillStyle = rgba(d.d, 0.55);
    ctx.beginPath(); ctx.ellipse(0, -0.9*r, 0.1*r, 0.05*r, 0, 0, 6.283); ctx.fill();
    glassLeaf(0.02*r, -0.92*r, 0.42*r, 0.14*r, 1.05);
  } else if (tier === 5){
    /* чешуйки лежат на кожуре, смотрят в основном вверх и чуть наружу,
       кончики загнуты от центра — снизу вверх, чтобы верхние ложились поверх нижних */
    var BR = [[-0.2,0.8],[0.34,0.78],[-0.56,0.44],[0.1,0.42],[0.6,0.4],[-0.62,0.02],[-0.06,-0.04],[0.56,-0.02],[-0.36,-0.42],[0.32,-0.44]];
    for (i=0;i<BR.length;i++){
      var px = BR[i][0]*1.15*r, py = (BR[i][1] + 0.03)*r, pl = Math.sqrt(px*px + py*py) || 1;
      var ddx = px/pl*0.4, ddy = py/pl*0.4 - 1, dl = Math.sqrt(ddx*ddx + ddy*ddy);
      bract(px, py, 0.36*r, 0.19*r, Math.atan2(ddx/dl, -ddy/dl), px < 0 ? -1 : 1);
    }
    for (i=-1;i<=1;i++) bract(i*0.12*r, -0.8*r, 0.3*r, 0.13*r, i*0.6, i || 1);
  } else if (tier === 7){
    ctx.fillStyle = "rgba(110,120,40,.85)";
    ctx.beginPath(); ctx.ellipse(0, -0.97*r, 0.07*r, 0.04*r, 0, 0, 6.283); ctx.fill();
  }
}

/* блики — не вращаются */
function drawGloss(tier, r){
  var b = bodyBox(tier, r), x = b[0], y = b[1], rx = b[2], ry = b[3];
  ctx.save();

  ctx.fillStyle = "rgba(255,255,255,.95)";

  ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255,.38)"; ctx.lineWidth = Math.max(1.2, 0.07*rx); ctx.lineCap = "round";
  ctx.beginPath(); ctx.ellipse(x, y, rx*0.8, ry*0.8, 0, -0.15, 1.15); ctx.stroke();

function drawCrate(r){
  var w = r*1.75, h = r*1.25, top = -h*0.3;
  var glow = ctx.createRadialGradient(0,0,2, 0,0,r*1.7);
  glow.addColorStop(0,"rgba(255,226,130,.6)"); glow.addColorStop(1,"rgba(255,200,80,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,r*1.7,0,6.283); ctx.fill();
  /* фрукты, выглядывающие из ящика */
  var c1 = FRUITS[4], c2 = FRUITS[3], c3 = FRUITS[1];
  ctx.fillStyle = rgba(c1.c, 0.95); ctx.beginPath(); ctx.arc(-0.38*r, top - 0.12*r, 0.42*r, 0, 6.283); ctx.fill();
  ctx.fillStyle = rgba(c2.c, 0.95); ctx.beginPath(); ctx.arc(0.32*r, top - 0.06*r, 0.36*r, 0, 6.283); ctx.fill();
  ctx.fillStyle = rgba(c3.c, 0.95); ctx.beginPath(); ctx.arc(-0.02*r, top - 0.3*r, 0.24*r, 0, 6.283); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.7)";
  ctx.beginPath(); ctx.arc(-0.5*r, top - 0.28*r, 0.09*r, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(0.22*r, top - 0.22*r, 0.07*r, 0, 6.283); ctx.fill();
  /* короб */
  var body = ctx.createLinearGradient(0, top, 0, top + h);
  body.addColorStop(0,"#b8803f"); body.addColorStop(1,"#6b4219");
  ctx.fillStyle = body;
  roundRect(-w/2, top, w, h, 3); ctx.fill();
  ctx.strokeStyle = "#3a200a"; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.strokeStyle = "rgba(60,30,8,.7)"; ctx.lineWidth = 1;
  for (var i=1;i<3;i++){ ctx.beginPath(); ctx.moveTo(-w/2, top + h*i/3); ctx.lineTo(w/2, top + h*i/3); ctx.stroke(); }
  ctx.fillStyle = "#ffe07a";
  ctx.font = "700 " + Math.round(r*0.62) + "px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "#4a2a0c";
  ctx.strokeText("+" + CRATE_BONUS, 0, top + h*0.55);
  ctx.fillText("+" + CRATE_BONUS, 0, top + h*0.55);
  ctx.textBaseline = "alphabetic";
}

/* ---- спрайты ----
   Градиенты, листья, точки и блики считать по 30 раз в кадр незачем: вид
   фрукта не меняется, меняются только положение, поворот и размер. */
var SS = Math.max(1, Math.min(2, DPR * 1.35));
var SPRITE_PAD = 30;
var SPRITES = [];
function spriteCanvas(box, fn){
  var c = document.createElement("canvas");
  c.width = c.height = Math.ceil(box * SS);
  var g2 = c.getContext("2d");
  g2.setTransform(SS, 0, 0, SS, box*SS/2, box*SS/2);
  var keep = ctx; ctx = g2; fn(); ctx = keep;
  return c;
}
function buildSprites(){
  for (var i=0;i<FRUITS.length;i++){
    (function(tier){
      var d = FRUITS[tier], box = (d.r + SPRITE_PAD) * 2;
      var body = spriteCanvas(box, function(){
        ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
        if (d.crate) drawCrate(d.r);
        else {
          /* тень одним тёмным силуэтом, чтобы полупрозрачное стекло не дало двойную */
          bodyPath(tier, d.r); ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fill();
          ctx.shadowColor = "rgba(0,0,0,0)";
          drawFruitBody(tier, d.r);
        }
      });
      var gloss = d.crate ? null : spriteCanvas(box, function(){ drawGloss(tier, d.r); });
      SPRITES[tier] = { body: body, gloss: gloss, box: box };
    })(i);
  }
}

/* Картинки фруктов. Пока картинка грузится (или если не загрузилась —
   например, в версии-артефакте без папки img/), рисуется прежний
   нарисованный кодом фрукт, а физика всё равно идёт по форме картинки. */
var ART_READY = 0;
function imageSprite(tier, im){
  var sh = SHAPES[tier], P = 8, w = sh.iw + P*2, h = sh.ih + P*2;
  var c = document.createElement("canvas");
  c.width = Math.ceil(w*SS); c.height = Math.ceil(h*SS);
  var g2 = c.getContext("2d");
  g2.imageSmoothingQuality = "high";
  g2.setTransform(SS, 0, 0, SS, 0, 0);
  g2.shadowColor = "rgba(0,0,0,.35)"; g2.shadowBlur = 6*SS; g2.shadowOffsetY = 3*SS;
  g2.drawImage(im, P, P, sh.iw, sh.ih);
  /* ox, oy — где на спрайте центр масс; bx, by — центр всей картинки */
  return { img: c, w: w, h: h, ox: P + sh.ix, oy: P + sh.iy, bx: P + sh.iw/2, by: P + sh.ih/2, fit: Math.max(sh.iw, sh.ih) };
}
function loadFruitArt(){
  for (var t=1;t<ART.length;t++) (function(t){
    var im = new Image();
    im.onload = function(){
      SPRITES[t] = imageSprite(t, im);
      /* лестница запечена — перепекаем, когда пришли все картинки */
      if (++ART_READY === ART.length - 1) bakeLadder();
    };
    im.src = ART[t].src;
  })(t);
}

/* значок: картинка целиком (с хвостиком и листьями) вписана в квадрат size */
function drawFruitIcon(tier, x, y, size, alpha){
  var sp = SPRITES[tier];
  if (!sp.img){ drawFruit(tier, x, y, size/2, 0, alpha, 0); return; }
  var f = size / sp.fit;
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.drawImage(sp.img, x - sp.bx*f, y - sp.by*f, sp.w*f, sp.h*f);
  ctx.restore();
}

function drawFruit(tier, x, y, r, angle, alpha, glow){
  var d = FRUITS[tier], sp = SPRITES[tier];
  if (sp.img){
    var f = r / d.r;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = (alpha === undefined) ? 1 : alpha;
    if (glow){
      ctx.save(); ctx.globalAlpha *= glow*0.5;
      var g0 = ctx.createRadialGradient(0,0,r*0.4, 0,0,r*2.1);
      g0.addColorStop(0, rgba(d.l, 1)); g0.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g0; ctx.beginPath(); ctx.arc(0,0,r*2.1,0,6.283); ctx.fill();
      ctx.restore();
    }
    if (angle) ctx.rotate(angle);
    ctx.drawImage(sp.img, -sp.ox*f, -sp.oy*f, sp.w*f, sp.h*f);
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = (alpha === undefined) ? 1 : alpha;
  if (glow){
    ctx.save(); ctx.globalAlpha *= glow*0.5;
    var gg = ctx.createRadialGradient(0,0,r*0.4, 0,0,r*2.1);
    gg.addColorStop(0, rgba(d.l, 1)); gg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0,0,r*2.1,0,6.283); ctx.fill();
    ctx.restore();
  }
  var w = sp.box * (r / d.r);
  if (angle) ctx.rotate(angle);
  ctx.drawImage(sp.body, -w/2, -w/2, w, w);
  if (angle) ctx.rotate(-angle);
  if (sp.gloss) ctx.drawImage(sp.gloss, -w/2, -w/2, w, w);
  ctx.restore();
}
function drawFruitObj(g){
  var r = g.r, glow = 0;
  if (g.pop < 1){
    /* новый фрукт «выдувается» из осколков с лёгким перелётом */
    var q = g.pop, c = 1.7;
    r = g.r * (0.55 + 0.45*(1 + (c+1)*Math.pow(q-1,3) + c*Math.pow(q-1,2)));
    glow = (1 - q)*0.8;
  }
  drawFruit(g.tier, g.x, g.y, r, g.angle, 1, glow);
}

/* ============== СЦЕНА: ТРОПИЧЕСКИЙ БАР ============== */
function bake(x, y, w, h, fn){
  var c = document.createElement("canvas");
  c.width = Math.ceil(w*DPR); c.height = Math.ceil(h*DPR);
  var g2 = c.getContext("2d");
  g2.setTransform(DPR, 0, 0, DPR, -x*DPR, -y*DPR);
  var keep = ctx; ctx = g2; fn(); ctx = keep;
  return { cv:c, x:x, y:y, w:w, h:h };
}
function blit(b){ ctx.drawImage(b.cv, b.x, b.y, b.w, b.h); }

var HORIZON = 432, SUN = { x: 322, y: HORIZON, r: 64 };
var COUNTER_Y = 702;
var BULBS = [];
(function(){

/* Море живое: блики солнечной дорожки и рябь по всей воде.
   Вода видна от горизонта до барной стойки (SEA_Y1), и сквозь кувшин тоже. */

    w: 6 + Math.random()*18*(0.4+gd), p: Math.random()*6.28, s: 1.5 + Math.random()*2.5, c: "#ffd9a0", a: 0.55 });
}
for (gi=0; gi<46; gi++){
  var gr = Math.random();
  GLINTS.push({ x: 42 + Math.random()*(W - 84), y: HORIZON + 8 + gr*(SEA_Y1 - HORIZON - 14),
    w: 5 + gr*16, p: Math.random()*6.28, s: 1 + gr*1.6, c: "#bfe6ff", a: 0.32 });
}

/* Гирлянда горит ровно и лишь изредка мигает: раз в 2–5 секунд
   одна-две случайные лампочки дважды быстро гаснут. */
var BLINK_NEXT = 0;
function bulbBlink(now){
  if (now > BLINK_NEXT){
    var n = Math.random() < 0.3 ? 2 : 1;
    for (var i=0;i<n;i++) BULBS[(Math.random()*BULBS.length)|0].blink = now;

/* 1 — горит, 0 — погасла */
function bulbOn(b, now){
  if (b.blink === undefined) return 1;
  var u = (now - b.blink) / 0.5;
  if (u < 0 || u >= 1) return 1;
  return (u < 0.22 || (u >= 0.5 && u < 0.72)) ? 0 : 1;
}

function bambooV(x, w, y0, y1){

/* лист пальмы: дугой вверх-наружу, кончик свисает, листочки обвисают вниз */
function frond(x, y, ang, len){
  var ex = x + Math.cos(ang)*len, ey = y + Math.sin(ang)*len*0.6 + len*0.45;
  var cx = x + Math.cos(ang)*len*0.55, cy = y + Math.sin(ang)*len*0.7 - len*0.3;
  ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
  ctx.lineWidth = 2.4; ctx.lineCap = "round";
  for (var i=2;i<=30;i++){
    var t = i/31, u = 1 - t;
    var px = u*u*x + 2*u*t*cx + t*t*ex, py = u*u*y + 2*u*t*cy + t*t*ey;
    var tx = 2*u*(cx-x) + 2*t*(ex-cx), ty = 2*u*(cy-y) + 2*t*(ey-cy), tl = Math.sqrt(tx*tx+ty*ty) || 1;
    tx /= tl; ty /= tl;
    var L = len*0.34*Math.pow(Math.sin(Math.PI*t), 0.7)*(1 - t*0.3);
    for (var s=-1;s<=1;s+=2){
      var dx = -ty*s*0.55 + tx*0.25, dy = tx*s*0.55 + ty*0.25 + 0.9, dl = Math.sqrt(dx*dx+dy*dy);
      ctx.beginPath(); ctx.moveTo(px, py);
      ctx.lineTo(px + dx/dl*L, py + dy/dl*L);
      ctx.stroke();
    }
  }
  ctx.lineCap = "butt";
}
function palm(bx, by, tx, ty, lean){
  ctx.fillStyle = ctx.strokeStyle = "#260f2c";
  var cx = (bx+tx)/2 + lean, cy = (by+ty)/2, i, N = 40, L = [], R = [];
  /* ствол — сплошной сужающийся силуэт с кольцами */
  for (i=0;i<=N;i++){
    var t = i/N, u = 1-t;
    var x = u*u*bx + 2*u*t*cx + t*t*tx, y = u*u*by + 2*u*t*cy + t*t*ty;
    var dx = 2*u*(cx-bx) + 2*t*(tx-cx), dy = 2*u*(cy-by) + 2*t*(ty-cy), dl = Math.sqrt(dx*dx+dy*dy) || 1;
    var w = 10 - t*5 + ((i % 3) === 0 ? 1.2 : 0);
    L.push([x - dy/dl*w, y + dx/dl*w]); R.push([x + dy/dl*w, y - dx/dl*w]);
  }
  ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]);
  for (i=1;i<=N;i++) ctx.lineTo(L[i][0], L[i][1]);
  for (i=N;i>=0;i--) ctx.lineTo(R[i][0], R[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(120,60,90,.35)"; ctx.lineWidth = 1;
  for (i=2;i<N;i+=2){ ctx.beginPath(); ctx.moveTo(L[i][0], L[i][1]); ctx.lineTo(R[i][0], R[i][1]); ctx.stroke(); }
  ctx.strokeStyle = "#260f2c";
  /* [угол, длина]: короткие листья вверх, длинные — в стороны и вниз */
  var A = [[-2.85,100],[-2.4,92],[-1.95,58],[-1.2,58],[-0.75,96],[-0.3,104],[0.3,80],[2.85,78]];
  for (var k=0;k<A.length;k++) frond(tx, ty, A[k][0], A[k][1]);
  ctx.beginPath(); ctx.arc(tx-6, ty+6, 7, 0, 6.283); ctx.arc(tx+5, ty+8, 6.5, 0, 6.283); ctx.fill();
}

/* Область, где видны фрукты: всё выше края кувшина и внутренность до
   середины толщины стекла. */
function jugClip(){
  var top = RIM_Y - 16, pad = 4, i;
  ctx.beginPath();
  ctx.moveTo(0, -50); ctx.lineTo(W, -50); ctx.lineTo(W, top);
  for (i=0;i<SIDE.length;i++) ctx.lineTo(CX + SIDE[i][1] + pad, Math.max(top, SIDE[i][0]));
  ctx.lineTo(CX + SIDE[SIDE.length-1][1] + pad, BOTTOM_Y + pad);
  ctx.lineTo(CX - SIDE[SIDE.length-1][1] - pad, BOTTOM_Y + pad);
  for (i=SIDE.length-1;i>=0;i--) ctx.lineTo(CX - SIDE[i][1] - pad, Math.max(top, SIDE[i][0]));
  ctx.lineTo(0, top);
  ctx.closePath();
}
function loopPath(P){
  ctx.moveTo(P[0][0], P[0][1]);
  for (var i=1;i<P.length;i++) ctx.lineTo(P[i][0], P[i][1]);
  ctx.closePath();
}
function sidePath(off, y0, y1, right){
  ctx.beginPath();
  var first = true;
  for (var i=0;i<SIDE.length;i++){
    var y = SIDE[i][0]; if (y < y0 || y > y1) continue;
    var x = right ? CX + SIDE[i][1] - off : CX - SIDE[i][1] + off;
    if (first){ ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
  }
}

   Сверху — солома с края крыши, слоями вверх; каждый слой чуть крупнее,
   будто крыша нависает над зрителем. Снизу — нижний ряд досок стойки
   (ниже раскосов) вытянут до края экрана. Края затемнены. */
var EXT_TOP = null, EXT_BOT = null;
var ROOF_BAND = 24, PLANK_FROM = 790;
function bakeExt(){
  EXT_TOP = EXT_BOT = null;
  if (!BG || OY < 0.5) return;
  var src = BG.cv, k = src.height / H, hb = VH - H - OY;
  EXT_TOP = bake(0, -OY, W, OY, function(){
    var y = 0, h = ROOF_BAND;
    while (y > -OY){
      ctx.drawImage(src, 0, 0, src.width, ROOF_BAND*k, 0, y - h, W, h);
      y -= h; h *= 1.12;
    }
    var g = ctx.createLinearGradient(0, 0, 0, -OY);
    g.addColorStop(0, "rgba(12,5,2,.1)"); g.addColorStop(1, "rgba(12,5,2,.75)");
    ctx.fillStyle = g; ctx.fillRect(0, -OY, W, OY);
  });
  EXT_BOT = bake(0, H, W, hb, function(){
    ctx.drawImage(src, 0, PLANK_FROM*k, src.width, (H - PLANK_FROM)*k, 0, H, W, hb);
    var g = ctx.createLinearGradient(0, H, 0, H + hb);
    g.addColorStop(0, "rgba(12,5,2,0)"); g.addColorStop(1, "rgba(12,5,2,.65)");
    ctx.fillStyle = g; ctx.fillRect(0, H, W, hb);
  });
}
function makeBulbSprites(){
  for (var i=0;i<BULBS.length;i++){
    var c = BULBS[i].c;
    if (BULB_SPR[c]) continue;
    BULB_SPR[c] = bake(-24, -24, 48, 48, (function(col){ return function(){
      var g = ctx.createRadialGradient(0,0,1, 0,0,24);
      g.addColorStop(0, col); g.addColorStop(0.25, col); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = 0.55; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,24,0,6.283); ctx.fill();
    }; })(c));
  }
}
function buildScene(){
  BG = bake(0, 0, W, H, drawBarRaw);
  JUG_BACK = bake(30, 140, 450, 580, drawJugBackRaw);
  JUG_FRONT = bake(30, 140, 450, 580, drawJugFrontRaw);
  makeBulbSprites();
}

function drawLights(){
  var i;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (i=0;i<GLINTS.length;i++){
    var gl = GLINTS[i], a = Math.max(0, Math.sin(S.time*1.8 + gl.p));
    if (a < 0.05) continue;
    ctx.globalAlpha = a*gl.a;
    ctx.fillStyle = gl.c;
    ctx.fillRect(gl.x - gl.w/2 + Math.sin(S.time*0.7 + gl.p)*4, gl.y, gl.w, gl.s);
  }
  var now = performance.now()/1000;
  bulbBlink(now);
  for (i=0;i<BULBS.length;i++){
    var b = BULBS[i];
    if (!bulbOn(b, now)) continue;
    ctx.globalAlpha = 0.8;
    ctx.drawImage(BULB_SPR[b.c].cv, b.x - 24, b.y - 24, 48, 48);
  }
  ctx.restore();
  for (i=0;i<BULBS.length;i++){
    var q = BULBS[i], on = bulbOn(q, now);
    if (BG_FROM_IMAGE){
      /* лампочка нарисована на фоне — гасим её тёмным пятном поверх */
      if (on) continue;
      var dg = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, 8);
      dg.addColorStop(0, "rgba(40,18,8,.85)"); dg.addColorStop(0.6, "rgba(40,18,8,.6)"); dg.addColorStop(1, "rgba(40,18,8,0)");
      ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(q.x, q.y, 8, 0, 6.283); ctx.fill();
      continue;
    }
    ctx.fillStyle = "#2a160a"; ctx.fillRect(q.x - 2, q.y - 9, 4, 4);
    ctx.fillStyle = on ? q.c : "#4a3020"; ctx.beginPath(); ctx.ellipse(q.x, q.y, 3.6, 5, 0, 0, 6.283); ctx.fill();
    if (on){ ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.beginPath(); ctx.arc(q.x - 1.2, q.y - 1.6, 1.2, 0, 6.283); ctx.fill(); }
  }
}

function drawDangerLine(){
  /* насколько куча близко к горлышку — по этому же значению краснеет линия */
  var near = 0, i;
  for (i=0;i<S.gems.length;i++){
    var g = S.gems[i];
    if (g.state !== "live" || g.tier === 0) continue;
    if (g.rs > 40) continue;
    var k = (BOTTOM_Y - topOf(g)) / (BOTTOM_Y - DANGER_Y);
    if (k > near) near = k;
  }
  near = Math.max(0, Math.min(1, near));
  var alarm = Math.max(0, (near - 0.72) / 0.28);
  var puls = 0.5 + 0.5*Math.sin(S.time * (3 + alarm*9));
  var hw = hwAt(DANGER_Y) - 6;
  ctx.save();
  ctx.setLineDash([9, 8]);
  ctx.lineWidth = 1.5 + alarm*1.5;
  ctx.strokeStyle = alarm > 0
    ? "rgba(255," + Math.round(150 - alarm*110) + "," + Math.round(140 - alarm*100) + "," + (0.35 + 0.6*alarm*puls) + ")"
    : "rgba(255,230,200,.25)";
  ctx.beginPath();
  ctx.moveTo(CX - hw, DANGER_Y); ctx.lineTo(CX + hw, DANGER_Y);
  ctx.stroke();
  ctx.setLineDash([]);
  if (alarm > 0){
    var gg = ctx.createLinearGradient(0, DANGER_Y, 0, DANGER_Y + 46);
    gg.addColorStop(0, "rgba(255,60,70," + (0.18*alarm*puls) + ")");
    gg.addColorStop(1, "rgba(255,60,70,0)");
    ctx.fillStyle = gg;
    ctx.fillRect(CX - hw, DANGER_Y, hw*2, 46);
  }
  ctx.restore();
}

function canDrop(){ return !S.over && S.left > 0; }

function drawGuide(){
  if (!canDrop() || S.cool > 0) return;
  var t = S.queue[0], sh = SHAPES[t], x = dropX(t);
  var y1 = landingY(x, t) + sh.bot, y0 = hoverY(t) + sh.bot + 4;
  if (y1 <= y0) return;
  ctx.save();
  var g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, "rgba(255,255,255,.45)"); g.addColorStop(1, "rgba(255,255,255,.08)");
  ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.setLineDash([6, 7]);
  ctx.lineDashOffset = -S.time*30;
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
  ctx.restore();
}

/* прищепка на бамбуковой перекладине и фрукт под ней */
function drawDropper(){
  var t = S.queue[0], r = FRUITS[t].r, sh = SHAPES[t];
  var x = canDrop() ? dropX(t) : CX;
  var ready = canDrop() ? 1 - Math.max(0, S.cool)/DROP_CD : 0;
  /* прищепка — прямо над кончиком хвостика, нитка висит отвесно */
  var clipX = x + sh.hx;
  ctx.save();
  if (ready > 0){
    var sway = Math.sin(S.time*2.2)*0.12;
    var fy = hoverY(t) + Math.sin(S.time*3)*1.5;
    var e = ready < 1 ? 1 - Math.pow(1 - ready, 3) : 1, k = 0.4 + 0.6*e;
    /* где кончик хвостика при текущем покачивании и росте */
    var hx = (Math.cos(sway)*sh.hx - Math.sin(sway)*sh.hy)*k, hy = (Math.sin(sway)*sh.hx + Math.cos(sway)*sh.hy)*k;
    ctx.strokeStyle = "rgba(240,220,180,.75)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(clipX, RAIL_Y + 10); ctx.lineTo(x + hx, fy + hy + 1); ctx.stroke();
    drawFruit(t, x, fy, r*k, sway, e, 0);
  }
  /* прищепка */
  ctx.fillStyle = "#c98f4c"; roundRect(clipX - 4.5, RAIL_Y - 9, 9, 22, 3); ctx.fill();
  ctx.strokeStyle = "#5a3412"; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = "#8a8f96"; ctx.fillRect(clipX - 5, RAIL_Y - 1, 10, 3);
  ctx.restore();
}

function drawShards(){
  for (var i=0;i<S.shards.length;i++){
    var s = S.shards[i], t = s.life/s.max, p = s.pts;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.globalAlpha = t < 0.6 ? 1 : (1 - t)/0.4;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    for (var k=2;k<p.length;k+=2) ctx.lineTo(p[k], p[k+1]);
    ctx.closePath();
    var sp = SPRITES[s.tier];
    if (sp && sp.img){
      /* осколок — вырезанный кусок картинки с того места, где он был */
      ctx.save(); ctx.clip();
      ctx.drawImage(sp.img, -s.lx - sp.ox, -s.ly - sp.oy, sp.w, sp.h);
      ctx.restore();
      ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = 1; ctx.stroke();
    } else {
      ctx.fillStyle = s.fill; ctx.fill();
      ctx.strokeStyle = s.edge; ctx.lineWidth = 1; ctx.stroke();
    }
    /* грань осколка вспыхивает, когда он повернулся к свету */
    var flare = Math.pow(Math.max(0, Math.sin(s.rot*1.3)), 6);
    if (flare > 0.05){
      ctx.globalAlpha *= flare;
      ctx.fillStyle = "#ffffff"; ctx.fill();
    }
    ctx.restore();
  }
}
function drawParts(){
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (var i=0;i<S.parts.length;i++){
    var p = S.parts[i];
    var t = 1 - p.life/p.max;
    if (p.star){ star4(p.x, p.y, p.s*t + 1, t); continue; }
    ctx.globalAlpha = t;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s*t, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (i=0;i<S.rings.length;i++){
    var r = S.rings[i], q = r.life/r.max;
    ctx.globalAlpha = (1-q)*0.8;
    ctx.strokeStyle = r.c; ctx.lineWidth = 3*(1-q) + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r*(0.8 + q*1.6), 0, 6.283); ctx.stroke();
  }
  ctx.restore();
}
function drawPops(){
  ctx.save(); ctx.textAlign = "center";
  for (var i=0;i<S.pops.length;i++){
    var p = S.pops[i];
    var t = p.life/p.max;
    ctx.globalAlpha = t < 0.15 ? t/0.15 : (1-t)*1.15;
