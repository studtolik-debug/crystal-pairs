    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(40,16,4,.7)";
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
}

/* Коктейль в бокале-купе с трубочкой и зонтиком. Рисуется в 20-юнитной
   сетке и масштабируется до s — один рисунок для таблички, рекордов и итогов. */
var COCKTAIL_AT = { x: 214, y: 33 };
function drawCocktail(x, y, s){
  ctx.save();
  ctx.translate(x, y); ctx.scale(s/20, s/20);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  /* трубочка — за бокалом */
  ctx.strokeStyle = "#ff4d6d"; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(11, -20); ctx.stroke();
  /* зонтик */
  ctx.save();
  ctx.strokeStyle = "#f3e2c0"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-3, 2); ctx.lineTo(-9, -15); ctx.stroke();
  ctx.translate(-9, -15); ctx.rotate(-0.35);
  var uc = ["#ffd34d", "#ff5fa0", "#4fd1ff", "#ff8a3d"];
  for (var k=0;k<4;k++){
    ctx.fillStyle = uc[k];
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.arc(0, 0, 9, Math.PI + k*Math.PI/4, Math.PI + (k+1)*Math.PI/4);
    ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = "rgba(60,20,10,.35)"; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.arc(0, 0, 9, Math.PI, 0); ctx.stroke();
  ctx.restore();
  /* напиток в чаше */
  ctx.beginPath();
  ctx.moveTo(-16, -8); ctx.quadraticCurveTo(-15, 8, 0, 10); ctx.quadraticCurveTo(15, 8, 16, -8);
  ctx.closePath();
  var dg = ctx.createLinearGradient(0, -8, 0, 10);
  dg.addColorStop(0, "#ffc24d"); dg.addColorStop(1, "#ff3f7f");
  ctx.fillStyle = dg; ctx.fill();
  ctx.fillStyle = "rgba(255,245,225,.75)";
  ctx.fillRect(-15.5, -8, 31, 2.2);
  /* стекло: контур, ножка, основание */
  ctx.strokeStyle = "rgba(235,250,255,.9)"; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-16, -8); ctx.quadraticCurveTo(-15, 8, 0, 10); ctx.quadraticCurveTo(15, 8, 16, -8);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, 19); ctx.stroke();
  ctx.fillStyle = "rgba(235,250,255,.85)";
  ctx.beginPath(); ctx.ellipse(0, 20, 7, 1.8, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-11, -4); ctx.quadraticCurveTo(-10, 3, -5, 6); ctx.stroke();
  /* долька лайма на краю */
  ctx.fillStyle = "#9be25a";
  ctx.beginPath(); ctx.arc(15, -9, 4.5, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "#3f8f1f"; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = "rgba(240,255,220,.9)"; ctx.lineWidth = 0.6;
  for (k=0;k<3;k++){
    var a = k*2.094;
    ctx.beginPath(); ctx.moveTo(15, -9); ctx.lineTo(15 + Math.cos(a)*3.6, -9 + Math.sin(a)*3.6); ctx.stroke();
  }
  ctx.restore();
}
/* летящие к табличке коктейли: дуга вверх, по дороге уменьшаются */
function drawFlyers(){
  for (var i=0;i<S.flyers.length;i++){
    var f = S.flyers[i], t = f.t, e = t*t*(3 - 2*t);
    var x = f.x + (COCKTAIL_AT.x - f.x)*e;
    var y = f.y + (COCKTAIL_AT.y - f.y)*e - Math.sin(t*Math.PI)*90;
    var s = 13*HUD.u + 30*Math.sin(Math.min(1, t*1.6)*Math.PI*0.5)*(1 - e);
    ctx.save();
    ctx.globalAlpha = Math.min(1, t*6);
    ctx.shadowColor = "rgba(255,200,120,.8)"; ctx.shadowBlur = 14;
    drawCocktail(x, y, s);
    ctx.restore();
  }
}

/* деревянная табличка — на ней висят счёт и запас фруктов */
function sign(x, y, w, h){
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  roundRect(x, y, w, h, 9);
  var g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#8c5626"); g.addColorStop(1, "#5a3110");
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  roundRect(x, y, w, h, 9);
  ctx.strokeStyle = "#2e1606"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = "rgba(255,210,150,.18)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + 8, y + h*0.55); ctx.lineTo(x + w - 8, y + h*0.55 + 1); ctx.stroke();
  ctx.fillStyle = "#d8c39a";
  ctx.beginPath(); ctx.arc(x + 7, y + 7, 1.8, 0, 6.283); ctx.arc(x + w - 7, y + 7, 1.8, 0, 6.283); ctx.fill();
}
/* табличка с подписью и числом; x0 — левый край относительно точки привязки */
function hudBox(x0, label, value, color){
  sign(x0, 0, 112, 52);
  ctx.textAlign = "center";
  ctx.font = "600 11px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,220,160,.8)";
  ctx.fillText(label, x0 + 56, 16);
  ctx.font = "700 25px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(40,16,4,.6)";
  ctx.strokeText(value, x0 + 56, 42);
  ctx.fillStyle = color; ctx.fillText(value, x0 + 56, 42);
}
/* Таблички висят у верхнего края экрана (HUD.y) и крупнеют в HUD.u раз:
   левая прижата к левому краю, правая — к правому, коктейли — по центру. */
function drawHud(){
  var u = HUD.u;
  ctx.save();
  ctx.textBaseline = "alphabetic";
  ctx.save(); ctx.translate(12, HUD.y); ctx.scale(u, u);
  hudBox(0, "ОЧКИ", String(S.score), "#fff");
  ctx.restore();
  /* прибавка из ящика подсвечивается, чтобы её было видно на счётчике */
  ctx.save(); ctx.translate(W - 12, HUD.y); ctx.scale(u, u);
  hudBox(-112, "ФРУКТЫ", String(S.left), S.crateFlash > 0 ? "#ffe07a" : (S.left <= 5 ? "#ff9a8a" : "#fff"));
  ctx.restore();

  /* счёт коктейлей: долетевшие до таблички, летящие ещё не считаем */
  ctx.save(); ctx.translate(W/2, HUD.y); ctx.scale(u, u);
  sign(-50, 0, 100, 48);
  drawCocktail(-26, 25, 13);
  var shown = S.cocktails - S.flyers.length, bump = 1 + S.cocktailBump*0.9;
  ctx.translate(10, 33); ctx.scale(bump, bump);
  ctx.font = "700 20px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.lineWidth = 3; ctx.strokeStyle = "rgba(40,16,4,.6)";
  ctx.strokeText("x" + shown, 0, 0);
  ctx.fillStyle = S.cocktailBump > 0 ? "#ffd6ea" : "#fff"; ctx.fillText("x" + shown, 0, 0);
  ctx.restore();
  ctx.restore();
}

/* Лестница из семи фруктов не меняется за партию — печём один раз. */
var LADDER = null;
var LADDER_BOX = { x: 128, y: 738, w: 252, h: 48 };
function drawLadderRaw(){

  var rs = [6,7,8.5,10,11.5,13,15], gap = 12, i, total = gap*(TOP-1);

  for (i=0;i<TOP;i++){

      ctx.font = "600 11px system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.fillText("›", cx + r + gap/2, cy + 4); ctx.globalAlpha = 1;
    }
    x = cx + r + gap;
  }
}

var BTN_SOUND = { x: 44, y: 762, r: 19, u: 1 };
var BTN_REC   = { x: 94, y: 762, r: 19, u: 1 };
var NEXT_BOX  = { x: 394, y: 732, w: 74, h: 60, u: 1 };

/* ---- раскладка панелей ----
   Экран в игровых координатах — от -OY до VH-OY (см. fitView). Таблички
   счёта прижаты к его верху, кнопки, лестница и «следующий» — к низу.
   Чем длиннее экран, тем крупнее таблички; если снизу хватает места,
   лестница фруктов встаёт отдельным рядом над кнопками и «следующим». */
var HUD = { y: 8, u: 1 };            /* u считает fitView: от него зависит место сцены */
var LADDER_AT = { x: 128, y: 738, u: 1 };
var UI_BTN_U = 1.3, UI_LADDER_U = 1.4, UI_TWO_ROWS = false;
var SAFE_TOP = 0, SAFE_BOT = 0;      /* игровые единицы, считает fitView */
function setBtn(b, x, y, u){ b.x = x; b.y = y; b.u = u; b.r = 19*u; }
function layoutUI(){
  var top = -OY + SAFE_TOP, bot = VH - OY - SAFE_BOT;
  HUD.y = top + 8;
  COCKTAIL_AT.x = W/2 - 26*HUD.u;   /* сюда летят коктейли — центр бокала на табличке */
  COCKTAIL_AT.y = HUD.y + 25*HUD.u;

  var bu = UI_BTN_U, lu = UI_LADDER_U, B = NEXT_BOX;
  if (UI_TWO_ROWS){
    B.u = bu; B.x = W - 12 - B.w*bu; B.y = bot - 10 - B.h*bu;
    var cy = B.y + B.h*bu/2, r = 19*bu;
    setBtn(BTN_SOUND, 12 + r, cy, bu);
    setBtn(BTN_REC, 12 + 3*r + 12, cy, bu);
    LADDER_AT.u = lu;
    LADDER_AT.x = W/2 - LADDER_BOX.w*lu/2;
    LADDER_AT.y = B.y - 10 - LADDER_BOX.h*lu;
  } else {
    /* места мало — один ряд, как задумано для 3:5, просто у нижнего края */
    var dy = bot - H;
    B.u = 1; B.x = 394; B.y = 732 + dy;
    setBtn(BTN_SOUND, 44, 762 + dy, 1);
    setBtn(BTN_REC, 94, 762 + dy, 1);
    LADDER_AT.u = 1; LADDER_AT.x = LADDER_BOX.x; LADDER_AT.y = LADDER_BOX.y + dy;
  }
  bakeLadder();
}
function bakeLadder(){
  var L = LADDER_AT, b = LADDER_BOX;
  LADDER = bake(L.x, L.y, b.w*L.u, b.h*L.u, function(){
    ctx.translate(L.x, L.y); ctx.scale(L.u, L.u); ctx.translate(-b.x, -b.y);
    drawLadderRaw();
  });
}

/* круглая кнопка: рисуется в своей точке и масштабе, icon() — в её центре */
function roundBtn(b, icon){
  ctx.save();
  ctx.translate(b.x, b.y); ctx.scale(b.u, b.u);
  ctx.beginPath(); ctx.arc(0, 0, 19, 0, 6.283);
  ctx.fillStyle = "rgba(25,12,4,.62)"; ctx.fill();
  ctx.strokeStyle = "rgba(255,210,150,.4)"; ctx.lineWidth = 1.2; ctx.stroke();
  icon();
  ctx.restore();
}
function drawCounterUi(){
  ctx.save();
  ctx.textAlign = "center";
  blit(LADDER);

  var B = NEXT_BOX;
  ctx.save();
  ctx.translate(B.x, B.y); ctx.scale(B.u, B.u);
  roundRect(0, 0, B.w, B.h, 12);
  ctx.fillStyle = "rgba(25,12,4,.62)"; ctx.fill();
  ctx.strokeStyle = "rgba(255,210,150,.3)"; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.font = "600 9px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,220,160,.7)";
  ctx.fillText("СЛЕДУЮЩИЙ", B.w/2, B.h - 6);
  drawFruitIcon(S.queue[1], B.w/2, 26, 36, 0.95);
  ctx.restore();

  roundBtn(BTN_SOUND, function(){
    ctx.font = "700 12px system-ui, sans-serif"; ctx.fillStyle = "#ffe0b0";
    ctx.fillText(muted ? "OFF" : "ON", 0, 4);
  });
  /* кнопка рекордов — три столбика пьедестала */
  roundBtn(BTN_REC, function(){
    ctx.fillStyle = "#ffd75e";
    ctx.fillRect(-9,   1, 5, 6);
    ctx.fillRect(-2.5, -5, 5, 12);
    ctx.fillRect(4,    -2, 5, 9);
  });
  ctx.restore();
}

var REC_PANEL = { x: 44, y: 130, w: 392, h: 516 };
var REC_CLOSE = { x: 404, y: 160, r: 17 };

function panelBg(x, y, w, h){
  roundRect(x, y, w, h, 22);
  var g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#4a2a14"); g.addColorStop(1, "#24120a");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(255,200,130,.4)"; ctx.lineWidth = 2; ctx.stroke();
}

function drawRecords(){
  if (!showRecords) return;
  var P = REC_PANEL, i;
  ctx.save();
  ctx.fillStyle = "rgba(14,6,2,.82)"; fillView();
  panelBg(P.x, P.y, P.w, P.h);

  ctx.textAlign = "center";
  ctx.font = "700 24px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = "#fff"; ctx.fillText("Последние партии", 240, P.y + 46);

  ctx.font = "600 12px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,215,160,.75)";
  ctx.fillText(best > 0 ? "лучший результат: " + best : "рекордов пока нет", 240, P.y + 70);

  if (!STORAGE_OK){
    ctx.font = "600 11px \"Trebuchet MS\", system-ui, sans-serif";
    ctx.fillStyle = "#ff9aa8";
    ctx.fillText("браузер не даёт сохранять — список живёт до перезагрузки", 240, P.y + 88);
  }

  /* крестик */
  ctx.beginPath(); ctx.arc(REC_CLOSE.x, REC_CLOSE.y, REC_CLOSE.r, 0, 6.283);
  ctx.strokeStyle = "rgba(255,200,130,.45)"; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.strokeStyle = "#ffe0b0"; ctx.lineWidth = 2;
  var q = 5.5;
  ctx.beginPath();
  ctx.moveTo(REC_CLOSE.x-q, REC_CLOSE.y-q); ctx.lineTo(REC_CLOSE.x+q, REC_CLOSE.y+q);
  ctx.moveTo(REC_CLOSE.x+q, REC_CLOSE.y-q); ctx.lineTo(REC_CLOSE.x-q, REC_CLOSE.y+q);
  ctx.stroke();

  if (!hist.length){
    ctx.font = "600 14px \"Trebuchet MS\", system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,215,160,.6)";
    ctx.fillText("Сыграйте партию — она появится здесь", 240, P.y + 250);
    ctx.restore();
    return;
  }

  /* при предупреждении о хранилище таблицу сдвигаем ниже, чтобы не наехала на шапку */
  var top = P.y + (STORAGE_OK ? 100 : 116), rowH = 39;
  ctx.font = "600 10px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,215,160,.5)";
  ctx.textAlign = "left";  ctx.fillText("КОГДА", 74, top - 10);
  ctx.textAlign = "right"; ctx.fillText("ОЧКИ", 406, top - 10);

  var topScore = 0;
  for (i=0;i<hist.length;i++) if (hist[i].s > topScore) topScore = hist[i].s;

  for (i=0;i<hist.length;i++){
    var r = hist[i], y = top + i*rowH, isBest = (r.s === topScore && r.s > 0);
    if (isBest){
      roundRect(P.x+14, y+2, P.w-28, rowH-6, 9);
      ctx.fillStyle = "rgba(255,215,94,.10)"; ctx.fill();
      ctx.strokeStyle = "rgba(255,215,94,.35)"; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.textAlign = "left";
    ctx.font = "700 13px \"Trebuchet MS\", system-ui, sans-serif";
    ctx.fillStyle = isBest ? "#ffe07a" : "rgba(255,230,200,.88)";
    ctx.fillText(fmtDate(r.t), 74, y + 24);

    ctx.font = "600 11px \"Trebuchet MS\", system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,215,160,.6)";
    ctx.fillText(r.n + " " + plural(r.n, "фрукт", "фрукта", "фруктов"), 152, y + 24);

    drawCocktail(258, y + 18, 9);
    ctx.font = "700 12px \"Trebuchet MS\", system-ui, sans-serif";
    ctx.fillStyle = "#e4ffe0"; ctx.fillText("x" + r.d, 270, y + 24);

    drawFruit(0, 306, y + 19, 9, 0, 1, 0);
    ctx.fillStyle = "#ffe9a8"; ctx.fillText("x" + (r.c || 0), 318, y + 24);

    ctx.textAlign = "right";
    ctx.font = "700 19px \"Trebuchet MS\", system-ui, sans-serif";
    ctx.fillStyle = isBest ? "#ffe07a" : "#fff";
    ctx.fillText(String(r.s), 406, y + 25);
  }
  ctx.restore();
}

var BTN = { x: 140, y: 486, w: 200, h: 54 };
var REASON_OVERFLOW = "кувшин переполнен";
function drawOverlay(){
  if (!S.over) return;
  ctx.save();
  ctx.fillStyle = "rgba(14,6,2,.72)"; fillView();
  panelBg(70, 196, 340, 368);
  ctx.textAlign = "center";
  ctx.font = "700 32px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = "#fff"; ctx.fillText("Бар закрыт", 240, 248);
  ctx.font = "600 13px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = S.reason === REASON_OVERFLOW ? "#ff9a8a" : "rgba(255,215,160,.75)";
  ctx.fillText(S.reason, 240, 272);

  ctx.font = "600 12px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,215,160,.7)"; ctx.fillText("ВАШ РЕЗУЛЬТАТ", 240, 306);
  ctx.font = "700 58px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = "#ffe9a8"; ctx.fillText(String(S.score), 240, 360);

  drawCocktail(158, 406, 17);
  ctx.font = "700 22px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = "#e4ffe0"; ctx.textAlign = "left";
  ctx.fillText("x " + S.cocktails, 184, 416);
  drawFruit(0, 278, 408, 18, 0, 1, 0.45);
  ctx.fillStyle = "#ffe9a8";
  ctx.fillText("x " + S.crates, 304, 416);

  ctx.textAlign = "center";
  ctx.font = "600 13px \"Trebuchet MS\", system-ui, sans-serif";
  var rec = S.score >= best && S.score > 0;
  ctx.fillStyle = rec ? "#9dffcf" : "rgba(255,215,160,.65)";
  ctx.fillText(rec ? "НОВЫЙ РЕКОРД!" : "рекорд: " + best, 240, 452);

  var hot = Math.sin(S.time*3)*0.5+0.5;
  roundRect(BTN.x, BTN.y, BTN.w, BTN.h, 27);
  var g = ctx.createLinearGradient(0,BTN.y,0,BTN.y+BTN.h);
  g.addColorStop(0,"#ffa24a"); g.addColorStop(1,"#e0522a");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255," + (0.3+0.3*hot) + ")"; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = "700 19px \"Trebuchet MS\", system-ui, sans-serif";
  ctx.fillStyle = "#fff"; ctx.fillText("Налить ещё", 240, BTN.y + 35);
  ctx.restore();
}

/* ============== ЦИКЛ ============== */
var acc = 0, prev = performance.now();
var keyDir = 0;
function frame(now){
  var dt = (now - prev)/1000; prev = now;
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;                 /* часы назад не идут: иначе аккумулятор ухнет в минус и физика встанет намертво */
  S.time += dt;

  if (!S.over){
    acc += dt;
    var step = 1/120, n = 0;
    while (acc >= step && n < 8){ physics(step); acc -= step; n++; }
    if (acc > step || acc < 0) acc = 0;
    S.cool = Math.max(0, S.cool - dt);
    if (keyDir) S.aimX = Math.max(CX - NECK_HW, Math.min(CX + NECK_HW, S.aimX + keyDir*320*dt));
  }
  updateFx(dt);
  S.shake *= 0.86;
  S.crateFlash = Math.max(0, S.crateFlash - dt);
  S.flash *= 0.90;

  /* переполнение: улёгшийся фрукт торчит над горлышком дольше DANGER_HOLD.
     Падающие и подпрыгнувшие не считаются — иначе бросок убивал бы партию. */
  if (!S.over){
    var above = false, i, g;
    for (i=0;i<S.gems.length;i++){
      g = S.gems[i];
      if (g.state !== "live" || g.tier === 0) continue;
      if (g.rs > 40) continue;          /* реальная скорость, а не vx/vy — см. physics() */
      if (topOf(g) < DANGER_Y){ above = true; break; }
    }
    S.danger = above ? S.danger + dt : 0;
    if (S.danger > DANGER_HOLD) endGame(REASON_OVERFLOW);
  }

  /* Фрукты кончились — ждём, пока куча уляжется, и подводим итог.
     Ждём не бесконечно: что бы ни случилось с физикой, экран итогов
     обязан появиться, иначе игрок застревает без кнопки рестарта. */
  if (!S.over && S.left <= 0){
    var busy = false;
    for (var k=0;k<S.gems.length;k++){
      var q = S.gems[k];
      if (q.state !== "live" || q.rs > 30){ busy = true; break; }
    }
    S.settle = busy ? 0 : S.settle + dt;
    S.endWait += dt;
    if (S.settle > 1.0 || S.endWait > 4.0) endGame("фрукты закончились");
  } else {
    S.settle = 0; S.endWait = 0;      /* ящик вернул фрукты — партия продолжается */
  }

  ctx.setTransform(DPR,0,0,DPR,0,OY*DPR);
  ctx.fillStyle = "#140906"; fillView();
  ctx.save();
  if (S.shake > 0.4) ctx.translate((Math.random()-0.5)*S.shake, (Math.random()-0.5)*S.shake);
  if (EXT_TOP) blit(EXT_TOP);
  if (EXT_BOT) blit(EXT_BOT);
  blit(BG);
  drawLights();
  blit(JUG_BACK);
  drawDangerLine();
  drawGuide();
  /* листья и хвостики не толкаются и могли бы торчать сквозь стекло —
     обрезаем рисунок фруктов по стенкам кувшина (выше края — без обрезки) */
  ctx.save(); jugClip(); ctx.clip();
  for (var j=0;j<S.gems.length;j++) drawFruitObj(S.gems[j]);
  ctx.restore();
  drawShards();
  blit(JUG_FRONT);
  drawDropper();
  drawParts();
  drawPops();
  ctx.restore();

  drawHud();
  drawFlyers();
  drawCounterUi();

  if (S.flash > 0.02){
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(255,230,190," + (S.flash*0.3) + ")";
    fillView(); ctx.restore();
  }
  drawOverlay();
  drawRecords();
  requestAnimationFrame(frame);
}

function endGame(reason){
  S.over = true;
  S.reason = reason || "";
  pushHistory();
  if (S.score > best){
    best = S.score;
    storeSet(BEST_KEY, String(best));
  }
  sfxOver();
}

/* ============== ВВОД ============== */
function toLocal(e){
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width),
           y: (e.clientY - r.top)  * (VH / r.height) - OY };
}
window.addEventListener("resize", function(){ fitView(false); });
cv.addEventListener("pointermove", function(e){
  if (e.pointerType === "touch" && !aiming) return;   /* палец не «водит» мышью просто так */
  S.aimX = toLocal(e).x;
});
function near(p, b, pad){
  var dx = p.x - b.x, dy = p.y - b.y, r = b.r + (pad || 5);
  return dx*dx + dy*dy < r*r;
}

/* На мыши фрукт едет за курсором, поэтому клик = бросок.
   На тач-экране ведёшь пальцем — фрукт едет за ним, отпускаешь — падает. */
var aiming = false;
cv.addEventListener("pointerup", function(e){
  if (!aiming) return;
  aiming = false;
  S.aimX = toLocal(e).x;
  fire();
});
cv.addEventListener("pointercancel", function(){ aiming = false; });
cv.addEventListener("pointerleave", function(){ aiming = false; });

cv.addEventListener("pointerdown", function(e){
  e.preventDefault();
  var p = toLocal(e);

  /* пока открыты рекорды — игра ввод не получает */
  if (showRecords){
    var P = REC_PANEL;
    if (near(p, REC_CLOSE, 9) ||
        p.x < P.x || p.x > P.x + P.w || p.y < P.y || p.y > P.y + P.h){
      showRecords = false;
      tone(300, 0.08, "sine", 0.06);
    }
    return;
  }

  if (near(p, BTN_SOUND)){
    muted = !muted;
    if (!muted) ping(1800, 0.2, 0.06, 0);
    return;
  }
  if (near(p, BTN_REC)){
    showRecords = true;
    tone(520, 0.10, "sine", 0.07);
    return;
  }
  if (S.over){
    if (p.x > BTN.x && p.x < BTN.x+BTN.w && p.y > BTN.y && p.y < BTN.y+BTN.h){
      reset(); ping(1600, 0.25, 0.06, 0); ping(2400, 0.3, 0.05, 0.08);
    }
    return;
  }
  S.aimX = p.x;
  if (e.pointerType === "touch") aiming = true;   /* бросок произойдёт на отпускании */
  else fire();
});
window.addEventListener("keydown", function(e){
  if (showRecords){
    if (e.code === "Escape" || e.code === "KeyT" || e.code === "Space"){ e.preventDefault(); showRecords = false; }
    return;
  }
  if (e.code === "Space"){ e.preventDefault(); if (S.over) reset(); else fire(); }
  if (e.code === "ArrowLeft" || e.code === "KeyA"){ e.preventDefault(); keyDir = -1; }
  if (e.code === "ArrowRight" || e.code === "KeyD"){ e.preventDefault(); keyDir = 1; }
  if (e.code === "ArrowDown" || e.code === "KeyS"){ e.preventDefault(); fire(); }
  if (e.code === "KeyR") reset();
  if (e.code === "KeyM") muted = !muted;
  if (e.code === "KeyT") showRecords = true;
});
window.addEventListener("keyup", function(e){
  if ((e.code === "ArrowLeft" || e.code === "KeyA") && keyDir < 0) keyDir = 0;
  if ((e.code === "ArrowRight" || e.code === "KeyD") && keyDir > 0) keyDir = 0;
});
window.addEventListener("contextmenu", function(e){ e.preventDefault(); });

/* Офлайн-режим. Service worker живёт только на http(s); при открытии файла
   напрямую (file://) его нет — игра просто работает без кэша. */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

buildSprites();
buildScene();
fitView(true);                      /* размер канвы, полосы фона, раскладка панелей и лестница */
loadFruitArt();
loadSceneArt();
reset();
requestAnimationFrame(frame);
</script>
